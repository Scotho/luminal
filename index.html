  <script>
    // Redirect non-canonical domains to luminal.live (skip localhost + test site)
    (function() {
      var h = location.hostname;
      if (h !== 'luminal.live' && h !== 'localhost' && h !== '127.0.0.1' && h !== 'hot' && h !== 'cold' && h !== 'admin' && h.indexOf('luminal-test') === -1 && h.indexOf('192.168') === -1) {
        location.replace('https://luminal.live' + location.pathname + location.search + location.hash);
      }
    })();
  </script>
