<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Luminal Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: rgba(56, 189, 248, 0.25); color: var(--text); }

    /* ── Design Tokens ────────────────────────────────── */
    :root {
      /* Default: Graphite (overridden per data-theme) */
      --bg:            rgb(15, 23, 42);
      --bg-panel:      rgb(17, 24, 39);
      --bg-panel-alt:  rgb(30, 41, 59);
      --bg-hover:      rgb(31, 41, 55);
      --bg-surface:    rgb(15, 23, 42);
      --bg-elevated:   rgba(17, 24, 39, 0.92);
      --border:        rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.24);
      --border-accent: rgba(56, 189, 248, 0.18);
      --text:          rgb(226, 232, 240);
      --text-dim:      rgb(148, 163, 184);
      --text-heading:  rgb(226, 232, 240);
      --text-quiet:    rgb(100, 116, 139);
      --accent:        rgb(56, 189, 248);
      --accent-bright: rgb(125, 211, 252);
      --accent-dim:    rgb(14, 165, 233);
      --gold:          rgb(251, 191, 36);
      --orange:        rgb(249, 115, 22);
      --green:         rgb(74, 222, 128);
      --red:           rgb(220, 38, 38);
      --red-bright:    rgb(248, 113, 113);
      --yellow:        rgb(250, 204, 21);
      --purple:        rgb(129, 140, 248);
      --claude:        #D97757;
      /* Fonts */
      --font-display:  'Orbitron', 'Courier New', monospace;
      --font-body:     'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      --font-mono:     'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      /* Radius — tight, utilitarian */
      --r-sm: 2px;
      --r-md: 3px;
      --r-lg: 4px;
      --r-xl: 6px;
      /* Shadows — minimal, functional */
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.25);
      --shadow-dropdown: 0 4px 16px rgba(0, 0, 0, 0.3);
      /* Transitions */
      --tr-fast: 0.12s ease;
      --tr-normal: 0.2s ease;
    }

    body {
      font-family: var(--font-body);
      font-weight: 600;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-quiet); }
    ::-webkit-scrollbar-track { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-bright); }
    button, input, select, textarea { font: inherit; }
    :focus-visible {
      outline: 1.5px solid var(--accent);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Sidebar ───────────────────────────────────────── */
    #sidebar {
      width: 220px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #sidebar h1 {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text);
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      margin: 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-item {
      padding: 6px 10px 6px 0;
      margin: 2px 0;
      min-height: 30px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-dim);
      transition: background var(--tr-fast), color var(--tr-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-item:not(:has(.nav-drag-grip)) { padding-left: 14px; }
    .nav-item--group-start { margin-top: 0; }
    .nav-item--group-end { margin-bottom: 0; }
    .nav-item:first-of-type { margin-top: 6px; }
    .nav-icon { display: inline-flex; align-items: center; flex-shrink: 0; opacity: 0.45; transition: opacity var(--tr-fast); }
    .nav-item:hover .nav-icon { opacity: 0.8; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-star { margin-left: auto; flex-shrink: 0; }
    .nav-item:hover { background: var(--bg-hover); color: var(--text); }
    .nav-item:active { transform: scale(0.98); transition: transform 0.06s ease-out; }
    .nav-item:hover .nav-star { opacity: 1 !important; }
    .nav-item.active {
      color: var(--text);
      background: var(--bg-hover);
      border-right: 2px solid var(--accent);
    }
    .nav-item--grouped {
      /* indent handled by wider grip */
    }
    .nav-group-header {
      padding: 10px 10px 3px;
      margin-top: 4px;
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-quiet);
      user-select: none;
    }
    .nav-group-chevron {
      display: inline-block;
      font-size: 8px;
      margin-right: 6px;
      transition: transform 0.15s;
      color: var(--text-quiet);
    }
    .nav-drag-grip {
      opacity: 0;
      cursor: grab;
      font-size: 12px;
      color: var(--text-quiet);
      width: 20px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
      user-select: none;
    }
    .nav-item--grouped .nav-drag-grip {
      width: 16px;
    }
    .nav-item:hover .nav-drag-grip { opacity: 0.5; }
    .nav-drag-grip:hover { opacity: 1 !important; color: var(--accent); }
    .nav-badge {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 0 5px;
      border-radius: 2px;
      flex-shrink: 0;
      line-height: 1.5;
      margin-left: auto;
      transition: transform 0.18s ease;
    }
    .nav-item:hover .nav-badge { transform: translateX(0); }

    /* ── Content ───────────────────────────────────────── */
    #content-row {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    #content {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      min-width: 0;
      transition: flex var(--tr-normal);
      scroll-behavior: smooth;
    }
    #auth-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }
    #auth-gate p { color: var(--text-dim); }
    #auth-gate button {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 28px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all var(--tr-fast);
    }
    #auth-gate button:hover {
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    /* ── Sections ──────────────────────────────────────── */
    .section { display: none; }
    .section.active { display: block; }
    .section--git.active,
    .section--live-diff.active {
      display: flex; flex-direction: column; overflow: hidden;
      /* Full-bleed: negate #content padding so section fills the entire pane */
      margin: -20px -24px; padding: 0;
      width: calc(100% + 48px); height: calc(100% + 40px);
    }
    .section h2 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section h3 {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 8px;
      color: var(--text-dim);
    }
    .section h4 {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 8px;
      color: var(--text-quiet);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    /* ── Buttons ───────────────────────────────────────── */
    .admin-btn {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: color var(--tr-fast), border-color var(--tr-fast);
      white-space: nowrap;
    }
    .admin-btn:hover {
      color: var(--text);
      border-color: var(--accent-dim);
    }
    .admin-btn:active { transform: scale(0.98); }
    .admin-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
    .admin-btn--accent {
      border-color: var(--border-strong);
      color: var(--text-dim);
    }
    .admin-btn--accent:hover {
      color: var(--text);
      border-color: var(--accent-dim);
    }
    .admin-btn--danger {
      border-color: var(--border-strong);
      color: var(--text-dim);
    }
    .admin-btn--danger:hover {
      color: var(--text);
      border-color: var(--accent-dim);
    }
    .admin-btn--small {
      font-size: 9px;
      letter-spacing: 1px;
      padding: 5px 10px;
    }

    /* Normalize all admin-btn inline color overrides to consistent muted style */
    .admin-btn[style*="color:var(--accent)"],
    .admin-btn[style*="color:var(--green)"],
    .admin-btn[style*="color:var(--orange)"],
    .admin-btn[style*="color:var(--red-bright"] {
      color: var(--text-dim) !important;
      border-color: var(--border-strong) !important;
    }
    .admin-btn[style*="color:var(--accent)"]:hover,
    .admin-btn[style*="color:var(--green)"]:hover,
    .admin-btn[style*="color:var(--orange)"]:hover,
    .admin-btn[style*="color:var(--red-bright"]:hover {
      color: var(--text) !important;
      border-color: var(--accent-dim) !important;
    }
    /* Server dropdown action buttons — normalize inline colors */
    .svc-action {
      color: var(--text-dim) !important;
      background: transparent !important;
      border-color: var(--border-strong) !important;
    }
    .svc-action:hover {
      color: var(--text) !important;
      border-color: var(--accent-dim) !important;
    }

    /* Legacy compat — remap refresh-btn to admin-btn style */
    .refresh-btn {
      font-family: var(--font-body);
      font-weight: 700;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: border-color var(--tr-fast), color var(--tr-fast);
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .refresh-btn:active { transform: scale(0.97); transition: transform 0.06s; }

    /* ── Task Filter Chips ────────────────────────────── */
    .task-filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }
    .filter-btn {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 5px 12px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 100px;
      cursor: pointer;
      transition: all var(--tr-fast);
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .filter-btn.active {
      background: rgba(56, 189, 248, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn .filter-count {
      display: inline-block;
      margin-left: 5px;
      font-size: 10px;
      font-weight: 400;
      opacity: 0.6;
    }
    .filter-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

    /* ── Feature Flag Rows ─────────────────────────────── */
    .ff-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .ff-row:hover { border-color: var(--accent-dim); }
    .ff-delete:hover { color: var(--red-bright) !important; border-color: var(--red) !important; }

    /* ── Task Card Buttons ────────────────────────────── */
    .task-btn {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 10px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all var(--tr-fast);
      white-space: nowrap;
    }
    .task-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .task-btn:active { transform: scale(0.96); }
    .task-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

    .task-btn--accent {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    .task-btn--accent:hover {
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .task-btn--done {
      border-color: rgba(56, 199, 106, 0.4);
      color: var(--green);
    }
    .task-btn--done:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .task-btn--danger {
      border-color: transparent;
      color: var(--text-quiet, rgba(255,255,255,0.25));
    }
    .task-btn--danger:hover {
      border-color: var(--red);
      color: var(--red-bright, #d45234);
    }

    /* ── Task Toolbar ─────────────────────────────────── */
    .task-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .task-toolbar__sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Settings ──────────────────────────────────────── */
    .settings-desc { color: var(--text-dim); font-size: 11px; margin: 0 0 10px; line-height: 1.5; }
    .settings-hint { color: var(--text-quiet); font-size: 10px; margin: 8px 0 2px; line-height: 1.4; }

    /* ── Stat Cards ────────────────────────────────────── */
    .last-updated { font-size: 11px; color: var(--text-dim); }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px;
      text-align: center;
      transition: border-color var(--tr-fast);
    }
    .stat-card:hover { border-color: var(--border-strong); }
    .stat-val {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-quiet);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 5px;
    }
    .stat-delta { font-size: 11px; color: var(--green); margin-top: 4px; }
    .stat-delta.negative { color: var(--red); }

    /* ── Data Tables ───────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table th {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .data-table th:hover { color: var(--accent); }
    .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .data-table tr:hover { background: var(--bg-hover); }

    /* ── Live Dot ──────────────────────────────────────── */
    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Report Cards ──────────────────────────────────── */
    .report-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color var(--tr-fast);
    }
    .report-card:hover { border-color: var(--accent); }
    .report-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .report-error { font-size: 13px; color: var(--red-bright); }
    .report-stack { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
    .report-stack summary { cursor: pointer; color: var(--text-dim); }
    .report-stack pre {
      margin-top: 6px;
      padding: 8px;
      background: var(--bg);
      border-radius: var(--r-lg);
      overflow-x: auto;
      font-size: 11px;
      white-space: pre-wrap;
    }
    .report-delete { color: var(--text-dim); cursor: pointer; font-size: 16px; line-height: 1; }
    .report-delete:hover { color: var(--red-bright); }

    /* ── Purge Buttons ─────────────────────────────────── */
    .purge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .purge-btn {
      padding: 12px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--r-lg);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: border-color var(--tr-fast), color var(--tr-fast);
      text-align: center;
    }
    .purge-btn:hover { border-color: var(--red); color: var(--red-bright); }
    .purge-btn.confirming { border-color: var(--red); color: var(--red-bright); }
    .purge-btn.executing { color: var(--orange); border-color: var(--orange); }
    .purge-btn.done { color: var(--green); border-color: var(--green); }

    /* ── Status Banner ─────────────────────────────────── */
    #app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #status-banner {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }
    .banner-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }
    .status-indicator {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .banner-icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text-dim);
      cursor: pointer;
      height: 28px; width: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: color var(--tr-fast), border-color var(--tr-fast);
      padding: 0;
    }
    #cc-status-btn { height: 28px; box-sizing: border-box; }
    .banner-icon-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .env-split-wrap { position: relative; }
    .env-split-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg-card, #1a1a2e); border: 1px solid var(--border, #333);
      border-radius: 3px; color: var(--text, #e0e0e0); cursor: pointer;
      font-size: 11px; padding: 4px 8px; transition: all 0.15s;
      font-family: inherit; line-height: 1; height: 26px; box-sizing: border-box;
    }
    .env-split-btn:hover { border-color: var(--accent-dim); }
    .env-split-btn .lucide { opacity: 0.6; }
    .env-split-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
    .env-split-label { font-weight: 600; letter-spacing: 0.5px; line-height: 0; }
    .env-split-caret { font-size: 13px; color: var(--text-dim, #888); line-height: 0; display: flex; align-items: center; }
    .resize-handle--vertical {
      width: 4px;
      cursor: col-resize;
      background: transparent;
      transition: background 0.15s;
      flex-shrink: 0;
      z-index: 10;
    }
    .resize-handle--vertical:hover,
    .resize-handle--vertical.active {
      background: var(--accent-dim);
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.yellow { background: var(--yellow); }
    .status-dot.red { background: var(--red-bright); }
    .status-dot.orange { background: var(--orange); }
    .status-dot.dim { background: var(--text-quiet); }
    #cc-status-btn {
      position: relative;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--r-sm);
      transition: color var(--tr-fast), border-color var(--tr-fast), background var(--tr-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #cc-status-btn:hover {
      color: var(--accent-bright);
      border-color: var(--accent-dim);
      background: rgba(56, 189, 248, 0.06);
    }
    #cc-status-btn.running {
      color: var(--orange);
      border-color: rgba(249, 115, 22, 0.4);
      background: rgba(249, 115, 22, 0.06);
      animation: ccPulse 2s infinite;
    }
    @keyframes ccPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ── Agents Dropdown ──────────────────────────────── */
    .agents-dd-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(110,224,240,0.04); border: 1px solid var(--border);
      border-radius: var(--r-sm); color: var(--text-dim); cursor: pointer;
      font-family: var(--font-display); font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 5px 12px; transition: all var(--tr-fast);
    }
    .agents-dd-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
    .agents-dd-count { color: var(--accent); font-family: var(--font-mono); }
    .agents-dd-caret { font-size: 7px; color: var(--text-quiet); margin-left: 2px; }
    .agents-dd-dropdown {
      position: absolute; top: 100%; right: 0; margin-top: 4px;
      background: var(--bg-panel-alt); border: 1px solid var(--border-strong);
      border-radius: var(--r-lg); min-width: 220px; z-index: 1000;
      box-shadow: var(--shadow-dropdown); padding: 4px 0;
    }
    .agents-dd-section-header {
      font-family: var(--font-display); font-size: 8px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: var(--text-heading);
      padding: 6px 12px 2px;
    }
    .agents-dd-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; font-size: 11px; color: var(--text-dim);
      cursor: pointer; transition: background 0.1s;
    }
    .agents-dd-row:hover { background: var(--bg-hover); color: var(--text); }
    .agents-dd-pool-status { margin-left: auto; font-size: 10px; color: var(--text-quiet); }
    .agents-dd-sep { height: 1px; background: var(--border); margin: 4px 0; }
    .agents-dd-empty { padding: 6px 12px; font-size: 11px; color: var(--text-quiet); font-style: italic; }

    .agents-tooltip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: var(--bg-surface); border: 1px solid var(--accent-dim);
      border-radius: var(--r-lg); padding: 10px 14px; min-width: 180px;
      box-shadow: 0 4px 16px rgba(2,3,5,0.6); z-index: 1001;
      animation: tooltipFadeIn 0.15s ease;
    }
    @keyframes tooltipFadeIn { from { opacity: 0; transform: translateX(-50%) translateY(4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .agents-tooltip-title {
      font-family: var(--font-display); font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-heading);
      margin-bottom: 6px;
    }
    .agents-tooltip-row { font-size: 11px; color: var(--text-dim); padding: 1px 0; }
    .agents-tooltip-row strong { color: var(--accent); }

    /* ── Agent Manager ─────────────────────────────────── */
    .agent-mgr-wrap {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 24px;
    }
    .agent-mgr-col {
      background: var(--bg-panel-alt); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; min-height: 80px;
      transition: border-color 0.15s;
    }
    .agent-mgr-col--dragover { border-color: var(--accent); background: rgba(110,224,240,0.04); }
    .agent-mgr-col-header {
      font-family: var(--font-display); font-size: 9px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }
    .agent-mgr-card {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg-panel);
      border: 1px solid var(--border); border-radius: 4px;
      cursor: grab; font-size: 12px; font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 6px;
    }
    .agent-mgr-card:hover { border-color: var(--accent-dim); }
    .agent-mgr-card:active { cursor: grabbing; }
    .agent-mgr-empty { color: var(--text-quiet); font-size: 11px; font-style: italic; padding: 8px 0; }
    .agents-section-header {
      font-family: var(--font-display);
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-heading);
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 12px 0;
    }
    .agents-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    /* ── CC Flyout Panel (inline push) ────────────────── */
    #cc-flyout {
      width: 475px;
      min-width: 475px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                  min-width 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.2s ease;
      flex-shrink: 0;
      position: relative;
    }
    #cc-flyout.collapsed {
      width: 0;
      min-width: 0;
      border-left-color: transparent;
      overflow: hidden;
    }
    #cc-flyout-resize {
      position: absolute;
      left: -3px;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 10;
      background: transparent;
    }
    #cc-flyout-resize:hover,
    #cc-flyout-resize.dragging {
      background: var(--accent-dim);
    }
    #cc-flyout-header {
      height: 38px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ── Agent Tabs ────────────────────────────────────── */
    #cc-agent-tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      padding: 0 6px;
      gap: 1px;
      align-items: stretch;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 0;
    }
    #cc-agent-tabs::-webkit-scrollbar { height: 3px; }
    #cc-agent-tabs::-webkit-scrollbar-track { background: transparent; }
    #cc-agent-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #cc-agent-tabs:empty { display: none; }
    .cc-agent-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      margin-top: 4px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--tr-fast), color var(--tr-fast), border-color var(--tr-fast);
      position: relative;
      letter-spacing: 0.2px;
    }
    .cc-agent-tab:first-child { margin-left: 0; }
    .cc-agent-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }
    .cc-agent-tab.active {
      color: var(--accent);
      background: var(--bg-panel);
      border-color: var(--border);
    }
    /* Active tab covers the bottom border of the tab bar */
    .cc-agent-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--bg-panel);
    }
    .cc-agent-tab .agent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cc-agent-tab .agent-dot.running { background: var(--orange); animation: pulse 2s infinite; }
    .cc-agent-tab .agent-dot.done { background: var(--green); }
    .cc-agent-tab .agent-dot.error { background: var(--red-bright); }
    .cc-agent-tab .agent-dot.cancelled { background: var(--text-quiet); }
    .agent-dot.ollama { background: var(--purple); box-shadow: 0 0 4px var(--purple); }
    .agent-dot.running.ollama { animation: ollamaPulse 2s infinite; }
    @keyframes ollamaPulse {
      0%, 100% { box-shadow: 0 0 4px var(--purple); }
      50% { box-shadow: 0 0 10px var(--purple); }
    }
    .cc-tab-icon {
      display: inline-flex;
      align-items: center;
      opacity: 0.5;
      flex-shrink: 0;
    }
    .cc-agent-tab:hover .cc-tab-icon,
    .cc-agent-tab.active .cc-tab-icon { opacity: 1; }

    .cc-tab-effort { font-size: 10px; opacity: 0.6; margin-right: 2px; font-weight: 700; }
    .cc-agent-tab.active .cc-tab-effort { opacity: 0.9; }

    /* Drag states */
    .cc-agent-tab[draggable="true"] { cursor: grab; }
    .cc-agent-tab.dragging { opacity: 0.4; cursor: grabbing; }
    .cc-agent-tab.drag-over { border-left: 2px solid var(--accent); }

    /* External session tabs */
    .cc-external-tab {
      cursor: pointer;
      opacity: 0.85;
      border-style: dashed;
      border-bottom: none;
    }
    .cc-external-tab:hover { color: var(--accent); }
    .cc-agent-badge {
      font-family: var(--font-display);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-radius: 2px;
      padding: 2px 5px;
      margin-right: 2px;
      white-space: nowrap;
      line-height: 1;
    }
    .cc-agent-badge--cc {
      color: var(--accent);
      background: rgba(110, 224, 240, 0.1);
      border: 1px solid rgba(110, 224, 240, 0.2);
    }
    .cc-agent-badge--ollama {
      color: var(--purple);
      background: rgba(170, 100, 255, 0.1);
      border: 1px solid rgba(170, 100, 255, 0.2);
    }
    .cc-agent-badge--ext {
      color: var(--text-quiet);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
    }
    .cc-agent-badge--admin {
      color: var(--purple, #aa64ff);
      background: rgba(170, 100, 255, 0.1);
      border: 1px solid rgba(170, 100, 255, 0.2);
    }
    .cc-session-close {
      margin-left: auto;
      padding: 0 3px;
      font-size: 14px;
      line-height: 1;
      color: var(--text-quiet);
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      cursor: pointer;
    }
    .cc-agent-tab:hover .cc-session-close { opacity: 1; }
    .cc-session-close:hover { color: var(--red); }

    .ctx-gauge { display: flex; align-items: center; gap: 8px; padding: 3px 10px; }
    .ctx-gauge-track { flex: 1; height: 3px; background: var(--bg-surface); border-radius: 2px; overflow: hidden; }
    .ctx-gauge-fill { height: 100%; width: 0; border-radius: 2px; transition: width 0.3s ease, background 0.3s ease; }
    .ctx-gauge-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); white-space: nowrap; }

    /* ── Ambient Status Bar (hidden for now) ─────────── */
    .ambient-status-bar {
      display: none;
    }
    .ambient-status-bar.asb--error { border-color: var(--red-bright); }
    .ambient-status-bar.asb--stalled { border-color: var(--yellow); }
    .asb-seg { cursor: default; transition: color 0.15s; }
    .asb-seg:hover { color: var(--accent); }
    .asb-dot { color: var(--border); margin: 0 2px; }
    .asb-effort { color: var(--accent); }
    .asb-cost { color: var(--green); }
    .asb-idle { color: var(--text-quiet); }

    /* ── Pool Dashboard (hidden for now) ─────────────── */
    .pool-dashboard { display: none; }
    .pool-dashboard-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-quiet); margin-bottom: 2px; }
    .pool-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 10px; font-family: var(--font-mono); }
    .pool-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .pool-name { color: var(--text); min-width: 50px; }
    .pool-status { font-size: 10px; }
    .pool-dispatched { color: var(--text-dim); }
    .pool-avg { color: var(--text-quiet); }

    #cc-flyout-output {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.65;
      background: var(--bg);
    }

    /* ── CC Actions (below output, above input) ────────── */
    #cc-flyout-actions {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      gap: 6px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    /* Caret toggle for bottom details */
    #cc-bottom-details-toggle {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-quiet);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--r-sm);
      transition: color var(--tr-fast), background var(--tr-fast);
    }
    #cc-bottom-details-toggle:hover {
      color: var(--text-dim);
      background: rgba(255,255,255,0.04);
    }
    .cc-bottom-caret {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #cc-bottom-details-toggle.collapsed .cc-bottom-caret {
      transform: rotate(180deg);
    }
    /* ── Collapsible bottom details panel ─────────────── */
    #cc-bottom-details {
      flex-shrink: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #cc-bottom-details-inner {
      /* Inner wrapper so content doesn't clip during animation */
    }
    #cc-bottom-details.collapsed {
      max-height: 0 !important;
    }

    /* ── Settings popup ───────────────────────────────── */
    #cc-flyout-settings-popup {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-dropdown);
      min-width: 140px;
      z-index: 200;
      overflow: hidden;
    }
    #cc-flyout-settings-popup.open { display: block; }
    .cc-settings-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 14px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background var(--tr-fast);
    }
    .cc-settings-item:last-child { border-bottom: none; }
    .cc-settings-item:hover { background: rgba(110,224,240,0.06); }
    .cc-settings-item--danger { color: var(--red); }
    .cc-settings-item--danger:hover { background: rgba(255,60,60,0.06); }

    /* ── CC Respond Input ──────────────────────────────── */
    #cc-flyout-respond {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      background: var(--bg-panel);
    }
    #cc-flyout-respond.hidden { display: none; }

    /* Target toggle (CC / Qwen) — icon-only pill group */
    #cc-target-toggle {
      display: flex;
      gap: 0;
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      overflow: hidden;
      background: var(--bg);
    }
    .cc-target-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-right: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all var(--tr-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cc-target-btn:last-child { border-right: none; }
    .cc-target-btn:hover { background: rgba(110, 224, 240, 0.06); color: var(--text); }
    .cc-target-btn.active { background: var(--claude); color: var(--text); }
    .cc-target-btn.active:hover { background: #e08a6a; }
    .cc-target-btn.active[data-target="ollama"] { background: var(--purple); }
    .cc-target-btn.active[data-target="ollama"]:hover { background: #bb77ff; }
    .cc-target-btn svg { flex-shrink: 0; }

    #cc-respond-input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 0 10px;
      height: 32px;
      box-sizing: border-box;
      outline: none;
      transition: border-color var(--tr-fast), box-shadow var(--tr-fast);
    }
    #cc-respond-input:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.12);
    }
    #cc-respond-input::placeholder { color: var(--text-quiet); }
    #cc-respond-send {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 0 14px;
      height: 32px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all var(--tr-fast);
      white-space: nowrap;
      flex-shrink: 0;
    }
    #cc-respond-send:hover {
      color: var(--accent-bright);
      border-color: var(--accent-dim);
      background: rgba(56, 189, 248, 0.04);
    }
    #cc-respond-send:disabled { opacity: 0.3; pointer-events: none; }

    /* ── CC History ─────────────────────────────────────── */
    #cc-flyout-history {
      border-top: 1px solid var(--border);
      max-height: 120px;
      overflow-y: auto;
      padding: 6px 12px;
      font-size: 12px;
      flex-shrink: 0;
      background: var(--bg-panel);
    }

    /* ── Player Detail Panel ──────────────────────────── */
    .player-detail-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 380px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-lg);
    }
    .player-detail-panel.open { transform: translateX(0); }
    .player-detail-header {
      height: 40px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .player-detail-title {
      font-family: var(--font-display);
      font-size: 9px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .player-segment-badge {
      font-family: var(--font-display);
      font-size: 8px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid;
      border-radius: 2px;
    }

    /* ── CC Template Dropdown ─────────────────────────────── */
    .cc-template-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      min-width: 240px;
      z-index: 10;
      max-height: 70vh;
      overflow-y: auto;
      padding: 4px 0;
      box-shadow: var(--shadow-dropdown);
    }
    /* ── Group wrapper ── */
    .cc-template-group { border-bottom: 1px solid var(--border); }
    .cc-template-group:last-child { border-bottom: none; }
    .cc-template-group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-quiet);
      cursor: pointer;
      user-select: none;
      transition: color 0.1s;
    }
    .cc-template-group-header:hover { color: var(--text-dim); }
    .cc-tg-chevron {
      display: flex;
      align-items: center;
      transition: transform 0.15s;
      flex-shrink: 0;
      color: var(--text-quiet);
    }
    .cc-template-group.collapsed .cc-tg-chevron { transform: rotate(-90deg); }
    .cc-template-group-body { padding-bottom: 4px; }
    .cc-template-group.collapsed .cc-template-group-body { display: none; }
    /* ── Items ── */
    .cc-template-item {
      padding: 5px 12px 5px 28px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s, color 0.1s;
    }
    .cc-template-item:hover { background: var(--bg-hover); color: var(--text); }
    .cc-template-icon { display: inline-flex; align-items: center; flex-shrink: 0; opacity: 0.5; }
    .cc-template-item:hover .cc-template-icon { opacity: 0.85; }
    .cc-template-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }
    .cc-pool-selector {
      display: flex;
      gap: 3px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    .cc-pool-btn {
      flex: 1;
      padding: 4px 0;
      font-family: var(--font-display);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    .cc-pool-btn.active {
      border-color: var(--accent-dim);
      color: var(--accent);
      background: rgba(110, 224, 240, 0.08);
    }
    .cc-pool-btn[data-pool="local"].active {
      border-color: var(--purple);
      color: var(--purple);
      background: rgba(170, 100, 255, 0.08);
    }
    .cc-template-chat-btn {
      margin-left: auto;
      padding: 3px;
      background: none;
      border: 1px solid transparent;
      border-radius: 2px;
      color: var(--text-quiet);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      opacity: 0;
    }
    .cc-template-item:hover .cc-template-chat-btn { opacity: 0.6; }
    .cc-template-chat-btn:hover { opacity: 1 !important; color: var(--accent); border-color: var(--border); }

    /* ── Prompt Alert Bar ───────────────────────────────────── */
    #cc-prompt-alert {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.04);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-shrink: 0;
    }
    #cc-prompt-alert.hidden { display: none; }
    #cc-prompt-alert-label {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--accent);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 72px;
      overflow-y: auto;
    }
    #cc-prompt-alert-close {
      background: none;
      border: none;
      color: var(--text-quiet);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 4px;
      line-height: 1;
      flex-shrink: 0;
      border-radius: var(--r-sm);
      transition: color 0.15s, background 0.15s;
    }
    #cc-prompt-alert-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }

    /* ── Skill Popover ──────────────────────────────────────── */
    .skill-popover {
      position: fixed;
      left: var(--sp-left, 0);
      bottom: var(--sp-bottom, 80px);
      width: var(--sp-width, 380px);
      max-height: min(520px, 60vh);
      overflow-y: auto;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-dropdown), 0 8px 32px rgba(0,0,0,0.35);
      z-index: 9999;
      padding: 6px 0;
      animation: slideUp 0.12s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .skill-popover-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .skill-popover-item:hover,
    .skill-popover-item.selected {
      background: var(--bg-hover);
      color: var(--text);
    }
    .skill-popover-item.selected {
      border-left: 2px solid var(--accent);
    }
    .skill-popover-item-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .skill-popover-item-desc {
      flex: 1;
      font-size: 11px;
      color: var(--text-quiet);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .skill-popover-tooltip {
      position: fixed;
      padding: 6px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text);
      max-width: 280px;
      z-index: 25;
      pointer-events: none;
      box-shadow: var(--shadow-dropdown);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .skill-popover-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .skill-popover-tooltip::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: var(--caret-left, 50%);
      transform: translateX(-50%);
      width: 10px;
      height: 5px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: var(--accent-dim);
    }
    .skill-popover-empty {
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: var(--text-quiet);
    }

    /* ── Prompt Editor ──────────────────────────────────────── */
    .prompt-editor-wrap {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
      flex-shrink: 0;
      position: relative;
    }
    .prompt-editor-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .prompt-editor-toolbar-btn {
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      background: none;
      border: 1px solid var(--accent-dim);
      border-radius: var(--r-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.4;
      white-space: nowrap;
    }
    .prompt-editor-toolbar-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── Button Group ──────────────────────────────────── */
    .btn-group {
      display: inline-flex;
      border: 1px solid var(--accent-dim);
      border-radius: var(--r-sm);
      overflow: hidden;
    }
    .btn-group-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .btn-group-item:not(:last-child) {
      border-right: 1px solid var(--accent-dim);
    }
    .btn-group-item:hover {
      background: rgba(110, 224, 240, 0.08);
      color: var(--text);
    }
    .btn-group-item.active {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-group-item.active[data-target="cc"] {
      background: var(--claude);
      color: white;
    }
    .btn-group-item.active[data-target="aider"] {
      background: var(--purple);
      color: white;
    }

    /* ── Aider Autonomy Toggle ─────────────────────────── */
    /* ── Effort dropdown (drops up) ──────────────────── */
    .prompt-editor-effort-dropdown { position: relative; }
    .effort-trigger {
      background: none;
      border: 1px solid var(--accent-dim);
      border-radius: var(--r-sm);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.4;
    }
    .effort-trigger:hover { border-color: var(--accent); color: var(--text); }
    .effort-value { color: var(--accent); font-weight: 700; }
    .effort-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 3px);
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-dropdown);
      min-width: 72px;
      overflow: hidden;
      z-index: 100;
    }
    .effort-menu.open { display: block; }
    .effort-menu button {
      display: block;
      width: 100%;
      padding: 4px 10px;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(110,224,240,0.05);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      text-align: left;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .effort-menu button:last-child { border-bottom: none; }
    .effort-menu button:hover { background: rgba(110,224,240,0.06); color: var(--text); }
    .effort-menu button.active { color: var(--accent); font-weight: 700; }

    /* ── Aider mode toggle (? / ▶ icons) ─────────────── */
    .aider-mode-toggle {
      display: inline-flex;
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .aider-mode-toggle.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .aider-mode-toggle .btn-group-item {
      padding: 4px 9px;
      font-size: 13px;
      min-width: 26px;
    }
    .aider-mode-toggle .btn-group-item.active[data-mode="suggest"] {
      background: rgba(255, 188, 62, 0.75);
      color: #ffffff;
    }
    .aider-mode-toggle .btn-group-item.active[data-mode="auto"] {
      background: rgba(60, 255, 60, 0.65);
      color: #ffffff;
    }

    /* ── Backend + mode toggles ── */
    .prompt-editor-backend-toggle .btn-group-item {
      background: rgba(235, 248, 255, 0.06);
      color: white;
    }
    .prompt-editor-backend-toggle .btn-group-item.active[data-target="cc"] {
      background: var(--claude);
      color: white;
    }
    .prompt-editor-backend-toggle .btn-group-item.active[data-target="aider"] {
      background: var(--purple);
      color: white;
    }
    .aider-mode-toggle .btn-group-item {
      background: rgba(235, 248, 255, 0.06);
      color: #ffffff;
    }
    .aider-mode-toggle .btn-group-item:hover {
      background: rgba(235, 248, 255, 0.1);
      color: #ffffff;
    }

    /* ── Effort dropdown — per-level colors ──────────────── */
    .effort-menu button[data-effort="low"]    { color: var(--accent); }
    .effort-menu button[data-effort="medium"] { color: var(--green); }
    .effort-menu button[data-effort="high"]   { color: var(--yellow); }
    .effort-menu button[data-effort="max"]    { color: var(--red-bright); }
    .effort-menu button[data-effort="low"].active    { color: var(--accent); }
    .effort-menu button[data-effort="medium"].active { color: var(--green); }
    .effort-menu button[data-effort="high"].active   { color: var(--yellow); }
    .effort-menu button[data-effort="max"].active    { color: var(--red-bright); }
    .effort-trigger[data-effort="low"]    .effort-value { color: var(--accent); }
    .effort-trigger[data-effort="medium"] .effort-value { color: var(--green); }
    .effort-trigger[data-effort="high"]   .effort-value { color: var(--yellow); }
    .effort-trigger[data-effort="max"]    .effort-value { color: var(--red-bright); }
    .effort-caret { font-size: 8px; opacity: 0.55; margin-left: 3px; display: inline-block; transition: transform 0.15s; }
    .effort-trigger[data-open="true"] .effort-caret { transform: rotate(-90deg); }
    @keyframes effortSelect {
      0%   { border-color: var(--accent); }
      100% { border-color: var(--border-strong); }
    }
    .effort-trigger.effort-flash { animation: effortSelect 0.45s ease-out forwards; }

    /* ── Floating window PromptEditor overrides ──────────── */
    .cc-floating-window .prompt-editor-wrap { border-top: 1px solid var(--border); }
    .cc-floating-window .prompt-editor-toolbar { padding: 4px 8px; }
    .cc-floating-window .prompt-editor-body { padding: 6px 8px 8px; }
    .cc-floating-window .prompt-editor-input { min-height: 22px; max-height: 70px; font-size: 11px; }

    .prompt-editor-body {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 14px 12px;
    }
    .prompt-editor-input {
      flex: 1;
      min-height: 26px;
      max-height: 160px;
      overflow-y: auto;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      padding: 8px 12px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      transition: border-color var(--tr-fast);
    }
    .prompt-editor-input:focus {
      border-color: var(--accent-dim);
    }
    .prompt-editor-input:empty::before {
      content: attr(data-placeholder);
      color: var(--text-quiet);
      pointer-events: none;
      font-size: 14px;
    }
    .prompt-editor-input::-webkit-scrollbar { width: 4px; }
    .prompt-editor-input::-webkit-scrollbar-thumb { background: rgba(110, 224, 240, 0.3); border-radius: 2px; }
    .prompt-editor-input::-webkit-scrollbar-track { background: transparent; }
    .prompt-editor-send {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 8px 16px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      align-self: flex-end;
    }
    .prompt-editor-send:hover {
      color: var(--accent-bright);
      border-color: var(--accent-dim);
    }
    .prompt-editor-send:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Skill Labels ───────────────────────────────────────── */
    .skill-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      margin: 0 2px;
      background: rgba(110, 224, 240, 0.07);
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      vertical-align: baseline;
      line-height: 1.5;
      white-space: nowrap;
      cursor: default;
    }
    .skill-label-name {
      white-space: nowrap;
      pointer-events: none;
    }
    .skill-label-context {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: none;
      border-left: 1px solid var(--accent-dim);
      padding: 2px 6px;
      margin-left: 3px;
      width: 5ch;
      min-width: 3ch;
      outline: none;
      border-radius: 0 2px 2px 0;
    }
    .skill-label-context::placeholder {
      color: var(--text-quiet);
    }
    .skill-label-close {
      background: none;
      border: none;
      color: var(--text-quiet);
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
    }
    .skill-label-close:hover { color: var(--red); }
    .skill-label-dropdown {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 10px;
      padding: 0;
      transition: color 0.15s;
    }
    .skill-label-dropdown:hover { color: var(--gold); }

    /* ── Attachment previews ─────────────────────────────────── */
    .prompt-editor-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 14px 6px;
    }
    .prompt-attachment {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(110, 224, 240, 0.05);
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      transition: border-color 0.15s;
    }
    .prompt-attachment:hover {
      border-color: var(--accent);
    }
    .prompt-attachment img {
      max-height: 36px;
      border-radius: 3px;
    }
    .prompt-attachment-close {
      background: none;
      border: none;
      color: var(--text-quiet);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
      transition: color 0.15s;
    }
    .prompt-attachment-close:hover { color: var(--red); }
    #prompt-editor-file-input { display: none; }

    /* ── File reference pills ────────────────────────────── */
    .prompt-file-refs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 14px 4px;
    }
    .prompt-file-refs:empty { display: none; }
    .prompt-file-ref {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 6px;
      background: rgba(60, 180, 255, 0.12);
      border: 1px solid rgba(60, 180, 255, 0.25);
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      cursor: default;
    }
    .prompt-file-ref .file-ref-icon { font-size: 12px; }
    .prompt-file-ref .file-ref-path { opacity: 0.85; }
    .prompt-file-ref .file-ref-close {
      background: none;
      border: none;
      color: var(--text-quiet);
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
    }
    .prompt-file-ref .file-ref-close:hover { color: var(--red, #ff4444); }

    /* ── Drop hover indicator ────────────────────────────── */
    .prompt-editor-body.drop-hover {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }

    /* ── Context Chips ───────────────────────────────────── */
    .context-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px; }
    .context-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 12px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 4px;
      font-family: var(--font-mono);
    }
    .context-chip:hover { border-color: var(--text); color: var(--text); }
    .context-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(110, 224, 240, 0.1); }
    .context-chip-icon { font-size: 12px; }
    .context-chip-tokens { font-size: 9px; opacity: 0.6; }

    /* ── CC Cards ───────────────────────────────────────── */
    .cc-card {
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      font-size: 11px;
      background: var(--bg-panel);
      transition: border-color 0.15s;
    }
    .cc-card:hover { border-color: var(--border-strong); }
    .cc-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      user-select: none;
    }
    .cc-card-header:hover { background: rgba(110, 224, 240, 0.03); }
    .cc-card-icon { font-size: 13px; flex-shrink: 0; }
    .cc-card-title {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      flex: 1;
    }
    .cc-card-chevron {
      font-size: 10px;
      color: var(--text-dim);
      transition: transform 0.2s ease;
    }
    .cc-card.expanded .cc-card-chevron { transform: rotate(180deg); }
    .cc-card-preview {
      padding: 4px 10px 8px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .cc-card-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      border-top: 1px solid transparent;
    }
    .cc-card.expanded .cc-card-body {
      max-height: 600px;
      overflow-y: auto;
      padding: 8px 10px;
      border-top-color: var(--border);
    }
    .cc-card.expanded .cc-card-preview { display: none; }

    /* Card type accents */
    .cc-card-text   { border-left: 3px solid var(--accent); }
    .cc-card-tool   { border-left: 3px solid var(--purple); }
    .cc-card-error  { border-left: 3px solid var(--red-bright); background: rgba(176, 45, 28, 0.06); }
    .cc-card-system { border-left: 3px solid var(--yellow); }
    .cc-card-result { border-left: 3px solid var(--green); background: rgba(60, 255, 60, 0.04); }

    .cc-history-item {
      padding: 4px 0;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 11px;
    }
    .cc-history-item:hover { color: var(--text); }

    /* ── Conversation Thread (Claude Code-like) ──────────── */
    /* ── Tool call timeline ─────────────────────────────── */
    .tl-wrap { padding: 8px 12px; }
    .tl-track { position: relative; height: 24px; background: var(--bg-surface); border-radius: 3px; margin: 4px 0 8px; overflow: hidden; }
    .tl-bar { position: absolute; top: 2px; height: 20px; border-radius: 2px; opacity: 0.85; cursor: pointer; transition: opacity 0.15s; min-width: 3px; }
    .tl-bar:hover { opacity: 1; z-index: 1; }
    .tl-legend { display: flex; gap: 12px; font-size: 10px; color: var(--text-dim); flex-wrap: wrap; }
    .tl-legend-item { display: flex; align-items: center; gap: 4px; }
    .tl-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .tl-empty { color: var(--text-quiet); font-size: 11px; padding: 12px; text-align: center; }

    .conv-thread {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
    }

    /* Session header — backend + time */
    .conv-session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .conv-backend-icon {
      display: inline-flex;
      align-items: center;
      opacity: 0.7;
    }
    .conv-backend--cc { color: var(--accent); }
    .conv-backend--ollama { color: var(--purple); }
    .conv-backend-label {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .conv-session-time {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-quiet);
    }

    /* ── User turn ──────────────────────────────────────── */
    .conv-turn--user {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      margin: 4px 0;
      background: rgba(110, 224, 240, 0.04);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
    }
    .conv-user-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--accent);
      background: rgba(110, 224, 240, 0.1);
      border-radius: 50%;
    }
    .conv-user-body {
      flex: 1;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    /* ── Assistant turn ─────────────────────────────────── */
    .conv-turn--assistant {
      padding: 6px 10px 6px 14px;
      margin: 0;
    }
    .conv-assistant-body {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }
    .conv-inline-code {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 1px 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      color: var(--accent);
    }
    .conv-streaming .conv-assistant-body::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: convBlink 1s steps(2) infinite;
    }
    @keyframes convBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── Tool call (inline, compact) ────────────────────── */
    .conv-tool {
      margin: 3px 0 3px 14px;
      border: 1px solid rgba(170, 100, 255, 0.15);
      border-left: 3px solid var(--purple);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      background: rgba(170, 100, 255, 0.03);
      font-size: 11px;
      overflow: hidden;
    }
    .conv-tool-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 6px;
      padding: 5px 8px;
      user-select: none;
    }
    .conv-tool-header:hover { background: rgba(170, 100, 255, 0.05); }
    .conv-tool-name {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      word-break: break-all;
    }
    .conv-tool-preview {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-quiet);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-tool-dur {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-quiet);
      margin-left: auto;
      flex-shrink: 0;
    }
    .conv-tool-chevron {
      font-size: 10px;
      color: var(--text-dim);
      transition: transform 0.2s ease;
    }
    .expanded > .conv-tool-header .conv-tool-chevron,
    .expanded > .conv-system-header .conv-tool-chevron,
    .expanded > .conv-result-header .conv-tool-chevron {
      transform: rotate(180deg);
    }
    .conv-tool-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      border-top: 1px solid transparent;
    }
    .expanded > .conv-tool-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 6px 8px;
      border-top-color: rgba(170, 100, 255, 0.1);
    }
    .conv-tool-spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid var(--purple);
      border-top-color: transparent;
      border-radius: 50%;
      animation: convSpin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes convSpin {
      to { transform: rotate(360deg); }
    }

    /* ── Agent dispatch (nested block) ──────────────────── */
    .conv-agent {
      margin: 4px 0 4px 14px;
      border: 1px solid rgba(255, 200, 60, 0.15);
      border-left: 3px solid var(--gold, #d4a843);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      background: rgba(255, 200, 60, 0.03);
      font-size: 11px;
    }
    .conv-agent-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      cursor: pointer;
      user-select: none;
    }
    .conv-agent-header:hover { background: rgba(255, 200, 60, 0.05); }
    .conv-agent-label {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold, #d4a843);
    }
    .conv-agent-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      border-top: 1px solid transparent;
    }
    .expanded > .conv-agent-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 6px 8px;
      border-top-color: rgba(255, 200, 60, 0.1);
    }
    .expanded > .conv-agent-header .conv-tool-chevron {
      transform: rotate(180deg);
    }

    /* ── Depth nesting (visual indent + border) ─────────── */
    .conv-depth-1 { margin-left: 24px; }
    .conv-depth-2 { margin-left: 44px; }
    .conv-depth-3 { margin-left: 60px; }
    .conv-depth-1.conv-turn--assistant { padding-left: 10px; border-left: 2px solid rgba(255,200,60,0.2); }
    .conv-depth-2.conv-turn--assistant { padding-left: 10px; border-left: 2px solid rgba(170,100,255,0.2); }
    .conv-depth-3.conv-turn--assistant { padding-left: 10px; border-left: 2px solid rgba(110,224,240,0.2); }

    /* ── System messages ────────────────────────────────── */
    .conv-system {
      margin: 2px 14px;
      font-size: 11px;
      overflow: hidden;
    }
    .conv-system-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      color: var(--text-quiet);
      user-select: none;
    }
    .conv-system-header:hover { color: var(--text-dim); }
    .conv-system-icon { font-size: 11px; color: var(--yellow); flex-shrink: 0; }
    .conv-system-text {
      font-family: var(--font-mono);
      font-size: 10px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-system--error .conv-system-icon { color: var(--red); }
    .conv-system--error .conv-system-text { color: var(--red); }
    .conv-system--error {
      background: rgba(176, 45, 28, 0.06);
      border-left: 3px solid var(--red);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
    }
    /* Lifecycle system cards — dimmer, less intrusive */
    .conv-system--lifecycle {
      opacity: 0.6;
    }
    .conv-system--lifecycle:hover {
      opacity: 1;
    }
    .conv-system--lifecycle .conv-system-icon {
      color: var(--text-quiet);
    }
    /* Lifecycle group — collapsed summary of 2+ lifecycle cards */
    .cc-lifecycle-group {
      opacity: 0.5;
      transition: opacity var(--tr-fast);
    }
    .cc-lifecycle-group:hover {
      opacity: 1;
    }
    .cc-lifecycle-group > .conv-tool-body {
      /* Override base max-height:0 — ensure truly hidden when collapsed */
      max-height: 0;
      padding: 0 8px 0 22px;
      overflow: hidden;
    }
    .cc-lifecycle-group.expanded > .conv-tool-body {
      max-height: 300px;
      padding: 4px 8px 6px 22px;
    }
    .cc-lifecycle-item {
      padding: 1px 0;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-quiet);
    }

    /* ── File context block ─────────────────────────────── */
    .conv-fc {
      margin: 4px 0 4px 14px;
      border: 1px solid rgba(74, 158, 255, 0.18);
      border-left: 3px solid var(--accent-dim, #4a9eff);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      background: rgba(74, 158, 255, 0.04);
      font-size: 11px;
      overflow: hidden;
    }
    .conv-fc--loading { opacity: 0.7; }
    .conv-fc-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      user-select: none;
    }
    .conv-fc-header:hover { background: rgba(74, 158, 255, 0.06); }
    .conv-fc-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conv-fc-label--loading { color: var(--accent-dim, #4a9eff); }
    .conv-fc-body { border-top: 1px solid rgba(74, 158, 255, 0.12); display: none; }
    .expanded > .conv-fc-header .conv-tool-chevron { transform: rotate(180deg); }
    .expanded > .conv-fc-body { display: block; }
    .conv-fc-file { border-bottom: 1px solid rgba(74, 158, 255, 0.08); padding: 6px 8px; }
    .conv-fc-file:last-child { border-bottom: none; }
    .conv-fc-file-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-dim, #4a9eff);
      margin-bottom: 4px;
    }
    .conv-fc-file-content {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    /* ── Result block ───────────────────────────────────── */
    .conv-result {
      margin: 4px 0 4px 14px;
      border: 1px solid rgba(60, 255, 60, 0.12);
      border-left: 3px solid var(--green);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      background: rgba(60, 255, 60, 0.03);
      font-size: 11px;
      overflow: hidden;
    }
    .conv-result-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      user-select: none;
    }
    .conv-result-header:hover { background: rgba(60, 255, 60, 0.04); }
    .conv-result-title {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green);
    }
    .conv-result-preview {
      padding: 2px 8px 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .expanded > .conv-result-preview { display: none; }

    /* ── AskUserQuestion interactive component ─────────── */
    .conv-ask {
      margin: 4px 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: rgba(70, 140, 255, 0.04);
      overflow: hidden;
    }
    .conv-ask-block { padding: 10px 12px 12px; }
    .conv-ask-block + .conv-ask-block { border-top: 1px solid var(--border); }
    .conv-ask-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .conv-ask-badge {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(70, 140, 255, 0.12);
      padding: 2px 8px;
      border-radius: 3px;
    }
    .conv-ask-question {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .conv-ask-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conv-ask-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .conv-ask-option:hover {
      background: rgba(70, 140, 255, 0.06);
      border-color: rgba(70, 140, 255, 0.15);
    }
    .conv-ask-option.conv-ask-focused {
      background: rgba(70, 140, 255, 0.10);
      border-color: var(--accent);
      outline: none;
    }
