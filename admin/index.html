    .conv-ask-option.conv-ask-selected {
      background: rgba(70, 140, 255, 0.12);
      border-color: var(--accent);
    }
    .conv-ask-option.conv-ask-selected .conv-ask-indicator--radio::after,
    .conv-ask-option.conv-ask-selected .conv-ask-indicator--checkbox::after {
      opacity: 1;
    }
    .conv-ask-indicator {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-dim);
      margin-top: 1px;
      position: relative;
      transition: border-color 0.12s;
    }
    .conv-ask-indicator--radio {
      border-radius: 50%;
    }
    .conv-ask-indicator--radio::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.12s;
    }
    .conv-ask-indicator--checkbox {
      border-radius: 3px;
    }
    .conv-ask-indicator--checkbox::after {
      content: '✓';
      position: absolute;
      top: -2px; left: 1px;
      font-size: 12px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.12s;
    }
    .conv-ask-focused .conv-ask-indicator {
      border-color: var(--accent);
    }
    .conv-ask-selected .conv-ask-indicator {
      border-color: var(--accent);
    }
    .conv-ask-option-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .conv-ask-option-label {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .conv-ask-option-desc {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .conv-ask-custom-wrap {
      padding: 4px 10px 2px;
    }
    .conv-ask-custom-wrap.hidden { display: none; }
    .conv-ask-custom-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.12s;
    }
    .conv-ask-custom-input:focus {
      border-color: var(--accent);
    }
    /* Number keys for quick selection */
    .conv-ask-option::before {
      content: attr(data-key-hint);
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      background: rgba(128, 128, 128, 0.12);
      padding: 1px 5px;
      border-radius: 2px;
      position: absolute;
      right: 8px;
      top: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .conv-ask:hover .conv-ask-option::before,
    .conv-ask-focused::before { opacity: 1; }

    /* ── Fade-in animation for new conversation blocks ──── */
    .conv-turn, .conv-tool, .conv-agent, .conv-system, .conv-result, .conv-ask, .conv-thinking {
      animation: convFadeIn 0.2s ease-out;
    }
    @keyframes convFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Thinking indicator ──────────────────────────────── */
    .conv-thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      color: var(--text-quiet);
    }
    .conv-thinking-text {
      font-family: var(--font-body);
      font-size: 12px;
      font-style: italic;
    }
    .conv-progress-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
      animation: convProgressFade 0.3s ease-out;
    }
    @keyframes convProgressFade {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 0.85; transform: translateX(0); }
    }

    /* ── Bug Reports Table ─────────────────────────────── */
    #bugs-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 12px;
    }
    #bugs-toolbar input,
    #bugs-toolbar select {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 4px 10px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
    }
    #bugs-toolbar .danger-btn {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red-bright);
      border-radius: var(--r-sm);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    #bugs-toolbar .danger-btn:hover { background: rgba(176, 45, 28, 0.1); }
    .bug-detail-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 10px 12px;
      margin: 4px 0 8px;
      font-size: 12px;
    }
    .bug-detail-row pre {
      margin-top: 6px;
      padding: 8px;
      background: var(--bg-panel);
      border-radius: var(--r-lg);
      overflow-x: auto;
      font-size: 11px;
      white-space: pre-wrap;
      color: var(--text-dim);
    }
    /* E2E test rows */
    .bug-row--e2e { border-left: 3px solid var(--accent, #1a7a8a); }
    .bug-detail-row--e2e { border-color: var(--accent, #1a7a8a); }

    /* Diagnostics panel inside expanded E2E bug */
    .bug-diag-section {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(26, 122, 138, 0.06);
      border: 1px solid rgba(26, 122, 138, 0.2);
      border-radius: var(--r-lg);
    }
    .bug-diag-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent, #1a7a8a);
      margin-bottom: 6px;
    }
    .bug-diag-row {
      font-size: 12px;
      margin-bottom: 3px;
    }
    .bug-diag-label {
      font-weight: 700;
      color: var(--text-dim);
    }
    .bug-diag-value { color: var(--text); }
    .bug-diag-expected { color: var(--green, #4caf50); }
    .bug-diag-actual { color: var(--red); }
    .bug-diag-extra {
      margin-top: 6px;
      padding: 6px 8px;
      background: var(--bg-panel);
      border-radius: var(--r-sm);
      font-size: 11px;
      white-space: pre-wrap;
      color: var(--text-dim);
      overflow-x: auto;
    }

    .bug-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 12px;
      color: var(--text-dim);
    }
    .bug-pagination button {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--r-sm);
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .bug-pagination button:disabled { opacity: 0.3; cursor: default; }

    /* ── Test Center ───────────────────────────────────── */
    .tc-switch-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .tc-switch {
      width: 32px;
      height: 16px;
      border-radius: 8px;
      background: var(--border);
      position: relative;
      transition: background 0.2s ease;
    }
    .tc-switch--on {
      background: var(--accent);
    }
    .tc-switch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.2s ease;
    }
    .tc-switch--on .tc-switch-knob {
      transform: translateX(16px);
      background: var(--bg);
    }
    .tc-switch-text {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
    }
    .tc-run-btn {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .tc-run-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .tc-run-btn:not(:disabled):hover {
      opacity: 0.85;
    }
    .tc-section {
      margin-bottom: 20px;
    }
    .tc-section-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .tc-runs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tc-runs-table th {
      text-align: left;
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .tc-runs-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .tc-run-row {
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .tc-run-row:hover {
      background: var(--bg-panel);
    }
    .tc-pip {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .tc-pip--pass { background: var(--green); }
    .tc-pip--fail { background: var(--red); }
    .tc-pip--warn { background: var(--yellow); }
    .tc-config-badge {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 10px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--bg);
    }
    .tc-bug-row {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .tc-bug-row:hover {
      background: var(--bg-panel);
    }
    .tc-bug-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .tc-bug-error {
      font-size: 12px;
      color: var(--red);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tc-bug-meta {
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .tc-bug-detail {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .tc-link-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      padding: 0;
      text-decoration: underline;
    }
    .tc-link-btn:hover { opacity: 0.8; }

    /* Live run view */
    .tc-live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .tc-live-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
    }
    .tc-live-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tc-elapsed {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
    }
    .tc-cancel-btn {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      background: var(--red);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .tc-cancel-btn:hover { opacity: 0.8; }
    .tc-pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: tc-pulse 1.2s ease-in-out infinite;
    }
    @keyframes tc-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .tc-live-stats {
      display: flex;
      gap: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .tc-output-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .tc-summary-card {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .tc-summary--pass {
      background: var(--bg-panel);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .tc-summary--fail {
      background: var(--bg-panel);
      border: 1px solid var(--red);
      color: var(--red);
    }
    .tc-completion-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .tc-action-btn {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tc-action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .tc-action-btn--accent {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .tc-action-btn--accent:hover {
      opacity: 0.85;
      color: var(--bg);
    }
    .tc-dispatch-investigating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .tc-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: tc-spin 0.8s linear infinite;
    }
    @keyframes tc-spin {
      to { transform: rotate(360deg); }
    }

    /* Run detail view */
    .tc-back-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tc-back-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .tc-fail-item {
      padding: 10px 12px;
      border: 1px solid var(--red);
      border-radius: 6px;
      margin-bottom: 8px;
      background: var(--bg-panel);
    }
    .tc-fail-name {
      font-size: 12px;
      color: var(--red);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .tc-fail-file {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .tc-fail-error {
      font-size: 10px;
      color: var(--red);
      white-space: pre-wrap;
      margin: 0 0 8px;
      max-height: 120px;
      overflow: auto;
    }
    .tc-followup-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tc-followup-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .tc-agent-panel {
      margin-top: 8px;
      animation: tc-slide-down 0.15s ease-out;
    }
    @keyframes tc-slide-down {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tc-agent-guidance {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 6px;
    }
    .tc-agent-guidance:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Test Center: Catalog ── */
    .tc-catalog-group {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-panel);
    }
    .tc-catalog-group summary {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-heading);
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tc-catalog-group summary::-webkit-details-marker { display: none; }
    .tc-catalog-group summary::before {
      content: '\25B6';
      font-size: 8px;
      color: var(--text-dim);
      transition: transform 0.15s ease;
    }
    .tc-catalog-group[open] summary::before {
      transform: rotate(90deg);
    }
    .tc-catalog-group-count {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    .tc-catalog-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 28px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      transition: background 0.1s ease;
    }
    .tc-catalog-item:hover {
      background: rgba(255,255,255,0.02);
    }
    .tc-catalog-item input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .tc-catalog-name {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      min-width: 120px;
    }
    .tc-catalog-desc {
      color: var(--text-dim);
      font-size: 11px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tc-catalog-file {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      opacity: 0.5;
      white-space: nowrap;
    }
    .tc-catalog-config {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── Test Center: Queue ── */
    .tc-queue-panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-panel);
      padding: 12px;
      margin-bottom: 20px;
    }
    .tc-queue-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .tc-queue-panel-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-dim);
    }
    .tc-queue-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tc-queue-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .tc-queue-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .tc-queue-item:last-child {
      border-bottom: none;
    }
    .tc-queue-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tc-queue-status--pending { background: var(--text-dim); }
    .tc-queue-status--active { background: var(--accent); animation: tc-pulse 1.2s ease-in-out infinite; }
    .tc-queue-status--done { background: var(--green); }
    .tc-queue-status--fail { background: var(--red); }
    .tc-queue-item-name {
      flex: 1;
      color: var(--text);
    }
    .tc-queue-item-config {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--border);
      color: var(--text-dim);
    }
    .tc-queue-remove {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .tc-queue-remove:hover {
      color: var(--red);
    }
    .tc-queue-empty {
      color: var(--text-dim);
      font-size: 11px;
      font-style: italic;
    }

    /* ── Test Center: Queue Running State ── */
    .tc-queue-panel--running {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(110, 224, 240, 0.08);
    }

    /* Status banner */
    .tc-queue-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background: rgba(110, 224, 240, 0.06);
      border: 1px solid rgba(110, 224, 240, 0.18);
      animation: tc-banner-in 0.3s ease-out;
      position: relative;
      overflow: hidden;
    }
    @keyframes tc-banner-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tc-queue-banner-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tc-queue-banner-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: tc-pulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .tc-queue-banner-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .tc-queue-banner-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tc-queue-banner-progress {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
    }
    .tc-queue-banner-elapsed {
      font-size: 11px;
      font-family: monospace;
      color: var(--accent);
      min-width: 32px;
      text-align: right;
    }
    .tc-queue-banner-bar {
      width: 100%;
      height: 3px;
      background: rgba(110, 224, 240, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .tc-queue-banner-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .tc-queue-banner-bar-pulse {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(110, 224, 240, 0.35), transparent);
      animation: tc-bar-sweep 1.8s ease-in-out infinite;
    }
    @keyframes tc-bar-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Active item highlight */
    .tc-queue-item--active {
      background: rgba(110, 224, 240, 0.04);
      animation: tc-item-activate 0.3s ease-out;
    }
    @keyframes tc-item-activate {
      from { background: rgba(110, 224, 240, 0.15); }
      to   { background: rgba(110, 224, 240, 0.04); }
    }

    /* Status labels */
    .tc-queue-label {
      font-family: var(--font-display);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      min-width: 48px;
      text-align: center;
    }
    .tc-queue-label--pending {
      background: rgba(128, 164, 174, 0.12);
      color: var(--text-dim);
    }
    .tc-queue-label--active {
      background: rgba(110, 224, 240, 0.15);
      color: var(--accent);
      animation: tc-label-glow 1.5s ease-in-out infinite;
    }
    @keyframes tc-label-glow {
      0%, 100% { box-shadow: 0 0 0 rgba(110, 224, 240, 0); }
      50%      { box-shadow: 0 0 6px rgba(110, 224, 240, 0.25); }
    }
    .tc-queue-label--done {
      background: rgba(60, 255, 60, 0.1);
      color: var(--green);
    }
    .tc-queue-label--fail {
      background: rgba(176, 45, 28, 0.15);
      color: var(--red-bright);
    }

    /* Per-item elapsed time */
    .tc-queue-item-elapsed {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-dim);
      min-width: 28px;
      text-align: right;
      flex-shrink: 0;
    }
    .tc-queue-item-elapsed--active {
      color: var(--accent);
    }

    /* Per-item result count */
    .tc-queue-item-result {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── Test Center: Stop / Pause / Current Test ── */
    .tc-stop-btn {
      font-size: 10px;
      padding: 4px 12px;
      background: var(--red);
      border: 1px solid var(--red);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: opacity 0.15s;
    }
    .tc-stop-btn:hover { opacity: 0.85; }
    .tc-stop-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .tc-pause-btn {
      font-size: 10px;
      padding: 4px 12px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .tc-pause-btn:hover { background: var(--border); }

    .tc-queue-current-test {
      flex-basis: 100%;
      font-size: 10px;
      color: var(--accent);
      opacity: 0.7;
      padding-left: 68px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
      margin-top: -4px;
    }

    .tc-queue-banner-test {
      font-size: 10px;
      color: var(--accent);
      opacity: 0.7;
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    /* Paused state */
    .tc-queue-panel--paused {
      border-color: rgba(224, 192, 96, 0.5);
      box-shadow: 0 0 12px rgba(224, 192, 96, 0.08);
    }
    .tc-queue-banner--paused {
      background: rgba(224, 192, 96, 0.06);
      border-color: rgba(224, 192, 96, 0.18);
    }
    .tc-queue-banner--paused .tc-queue-banner-dot {
      background: #e0c060;
      animation: none;
    }
    .tc-queue-banner--paused .tc-queue-banner-label {
      color: #e0c060;
    }

    /* Group checkbox in catalog summary */
    .tc-group-checkbox {
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Test Center: History ── */
    .tc-history-header {
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    .tc-history-header:hover {
      color: var(--accent);
    }
    .tc-sort-arrow {
      font-size: 8px;
      margin-left: 4px;
      opacity: 0.5;
    }
    .tc-sort-arrow--active {
      opacity: 1;
      color: var(--accent);
    }
    .tc-followup-toggle {
      cursor: pointer;
      user-select: none;
      text-align: center;
      font-size: 14px;
      transition: opacity 0.15s;
    }
    .tc-followup-toggle:hover {
      opacity: 0.7;
    }
    .tc-history-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .tc-history-pagination button {
      font-family: var(--font-display);
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tc-history-pagination button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .tc-history-pagination button:not(:disabled):hover {
      border-color: var(--accent);
    }
    .tc-history-filter {
      font-family: var(--font-display);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
    }

    /* ── Viewer ─────────────────────────────────────────── */
    .viewer-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin-bottom: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .viewer-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-heading);
    }
    .viewer-sep {
      color: var(--border);
      font-size: 14px;
      user-select: none;
    }
    .viewer-vehicle-tabs {
      display: flex;
      gap: 4px;
    }
    .viewer-vehicle-tab {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all var(--tr-fast);
    }
    .viewer-vehicle-tab:hover:not(:disabled) { color: var(--accent); border-color: var(--accent-dim); }
    .viewer-vehicle-tab.active { color: var(--accent); border-color: var(--accent); }
    .viewer-vehicle-tab:disabled { opacity: 0.3; cursor: default; }
    .viewer-toolbar label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }
    .viewer-toolbar select,
    .viewer-toolbar input[type="color"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .viewer-toolbar input[type="color"] {
      width: 28px;
      height: 24px;
      padding: 1px;
      border-radius: var(--r-sm);
    }
    .viewer-canvas-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 200px);
      min-height: 400px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .viewer-canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .viewer-stats {
      position: absolute;
      top: 8px;
      left: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.6;
      pointer-events: none;
      z-index: 1;
    }
    .viewer-pose-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--accent, #00ffd5);
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 213, 0.2);
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
    }
    .viewer-info-panel {
      margin-bottom: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .viewer-info-toggle {
      width: 100%;
      text-align: left;
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .viewer-info-toggle:hover { color: var(--accent); }
    .viewer-info-body { padding: 0 12px 8px; }
    .viewer-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 2px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
    }
    .viewer-stat-label {
      color: var(--text-dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .viewer-desc {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ── Trail Lab ──────────────────────────────────────── */
    .trail-lab { display: flex; flex-direction: column; gap: 8px; }
    .trail-lab-toolbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-md);
      font-size: 12px; flex-wrap: wrap;
    }
    .trail-lab-toolbar label { display: flex; align-items: center; gap: 6px; }
    .trail-lab-toolbar select { min-width: 220px; }
    .trail-lab-toolbar input[type="color"] { width: 28px; height: 24px; padding: 1px; border-radius: var(--r-sm); }
    .trail-lab-desc { color: var(--text-dim); font-style: italic; flex: 1; }
    .trail-lab-cat { color: var(--accent); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
    .trail-lab-canvas-wrap {
      position: relative; width: 100%; height: calc(100vh - 200px); min-height: 400px;
      background: #020305; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden;
    }
    .trail-lab-canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
    .trail-lab-params {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 12px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-md);
      min-height: 28px;
    }
    .trail-lab-param-row {
      display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--font-mono);
    }
    .trail-lab-param-row input[type="range"] { width: 100px; }
    .trail-lab-param-row span { min-width: 40px; text-align: right; color: var(--accent); }

    /* ── Generic form inputs ───────────────────────────── */
    input[type="text"], input[type="number"], textarea, select {
      font-family: var(--font-body);
      font-weight: 600;
    }

    /* ── Responsive layout ────────────────────────────── */
    @media (max-width: 900px) {
      #sidebar {
        width: 160px;
      }
      #sidebar h1 {
        font-size: 9px;
        letter-spacing: 2px;
      }
      .nav-item {
        font-size: 11px;
        padding: 6px 10px 6px 0;
        min-height: 28px;
      }
      .nav-group-header {
        font-size: 8px;
        padding: 8px 12px 3px;
      }
      #cc-flyout {
        width: 280px;
        min-width: 280px;
      }
      #cc-flyout.collapsed {
        width: 0;
        min-width: 0;
      }
    }

    /* ── Mobile tools toggle + tray (hidden on desktop) ── */
    #mobile-tools-toggle { display: none; }
    #mobile-admin-tray { display: none; }

    /* ── Mobile hamburger (hidden on desktop) ──────── */
    #mobile-hamburger {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      font-size: 22px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      transition: border-color var(--tr-fast), color var(--tr-fast);
      padding: 0;
      line-height: 1;
    }
    #mobile-hamburger:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Mobile backdrop overlay ─────────────────────── */
    #mobile-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
    }
    #mobile-backdrop.visible { display: block; }

    /* ── MOBILE: max-width 768px ─────────────────────── */
    @media (max-width: 768px) {

      /* -- Base typography -- */
      body { font-size: 16px; }

      /* -- Scrollbars: thumb-friendly -- */
      ::-webkit-scrollbar { width: 8px; height: 8px; }

      /* -- Hamburger visible -- */
      #mobile-hamburger { display: flex; }

      /* -- Sidebar: slide-out drawer -- */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        height: 100dvh;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        overflow-x: hidden;
        flex-direction: column;
        padding: 0;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
      }
      #sidebar h1 {
        display: flex;
        font-size: 10px;
        height: 56px;
        padding: 0 16px;
      }
      .nav-item {
        font-size: 15px;
        padding: 12px 16px 12px 0;
        min-height: 48px;
      }
      .nav-item.active {
        border-right: 3px solid var(--accent);
      }
      .nav-item--grouped .nav-drag-grip {
        width: 20px;
      }
      .nav-group-header {
        display: block;
        font-size: 11px;
        padding: 14px 20px 6px;
      }
      .nav-badge {
        font-size: 10px;
        padding: 2px 8px;
      }

      /* -- Status Banner: compact -- */
      #status-banner {
        height: 56px;
        padding: 0 12px;
        gap: 8px;
        font-size: 13px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 999;
      }
      .status-indicator > span:last-child {
        display: none; /* hide text labels, keep dots */
      }
      .banner-sep { display: none; }
      #banner-cc-usage { display: none !important; }

      /* -- Admin tools: hidden behind toggle on mobile -- */
      #status-banner > .env-split-wrap,
      #status-banner > #agents-dropdown-wrap,
      #status-banner > #banner-settings-btn {
        display: none;
      }
      /* Items visible when inside the open tray */
      #mobile-admin-tray .env-split-wrap,
      #mobile-admin-tray #agents-dropdown-wrap,
      #mobile-admin-tray #banner-settings-btn,
      #mobile-admin-tray #theme-toggle {
        display: flex !important;
      }

      /* -- Mobile admin tools tray -- */
      #mobile-admin-tray {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-strong);
        padding: 10px 12px;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      #mobile-admin-tray.open {
        display: flex;
      }

      /* -- Mobile tools toggle button -- */
      #mobile-tools-toggle {
        display: flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 18px;
        flex-shrink: 0;
        transition: border-color var(--tr-fast), color var(--tr-fast), background var(--tr-fast);
        padding: 0;
        line-height: 1;
      }
      #mobile-tools-toggle:hover,
      #mobile-tools-toggle.active {
        border-color: var(--accent-dim);
        color: var(--accent);
        background: rgba(56, 189, 248, 0.06);
      }

      #theme-toggle {
        width: 44px !important;
        height: 44px !important;
        font-size: 18px !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      #cc-status-btn {
        font-size: 10px;
        padding: 8px 14px;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      /* Active toggle state when flyout is open */
      #cc-status-btn.flyout-open {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      /* Hide main content when flyout is open for clean app feel */
      #content-row:has(#cc-flyout:not(.collapsed)) > #content {
        display: none;
      }

      /* -- Content area -- */
      #content {
        padding: 16px;
      }

      /* -- Section headings -- */
      .section h2 {
        font-size: 18px;
        letter-spacing: 3px;
        gap: 10px;
        margin-bottom: 14px;
      }
      .section-header {
        flex-wrap: wrap;
        gap: 10px;
      }

      /* -- Buttons: touch-friendly -- */
      .admin-btn {
        font-size: 12px;
        padding: 12px 20px;
        min-height: 44px;
      }
      .admin-btn--small {
        font-size: 11px;
        padding: 10px 14px;
        min-height: 40px;
      }
      .refresh-btn {
        font-size: 13px;
        padding: 10px 16px;
        min-height: 44px;
      }

      /* -- Stat Cards: 2-column grid -- */
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .stat-card {
        padding: 16px;
      }
      .stat-val {
        font-size: 32px;
      }
      .stat-label {
        font-size: 13px;
        letter-spacing: 1.5px;
        margin-top: 8px;
      }
      .stat-delta { font-size: 13px; }
      .last-updated { font-size: 13px; }

      /* -- Data Tables: horizontal scroll + sticky 1st col -- */
      .data-table {
        font-size: 14px;
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .data-table thead,
      .data-table tbody,
      .data-table tr {
        display: table;
        width: 100%;
        table-layout: fixed;
      }
      .data-table th {
        font-size: 11px;
        padding: 12px 14px;
      }
      .data-table td {
        padding: 12px 14px;
        min-height: 44px;
      }

      /* -- Generic tables in sections: horizontal scroll -- */
      .section table:not(.data-table) {
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
      }

      /* -- Code/log blocks: prevent overflow -- */
      .section pre {
        overflow-x: auto;
        max-width: 100%;
        word-break: break-word;
      }
      .section code {
        overflow-x: auto;
        max-width: 100%;
      }

      /* -- Report Cards -- */
      .report-card {
        padding: 16px;
      }
      .report-header { font-size: 14px; }
      .report-error { font-size: 15px; }
      .report-stack { font-size: 13px; }
      .report-stack pre { font-size: 13px; }
      .report-delete { font-size: 20px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

      /* -- Purge Buttons: single column -- */
      .purge-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .purge-btn {
        font-size: 14px;
        padding: 16px 20px;
        min-height: 48px;
      }

      /* -- Bugs Toolbar -- */
      #bugs-toolbar {
        font-size: 14px;
        gap: 10px;
      }
      #bugs-toolbar input,
      #bugs-toolbar select {
        font-size: 16px;
        padding: 8px 12px;
        min-height: 44px;
      }
      #bugs-toolbar .danger-btn {
        font-size: 14px;
        padding: 8px 14px;
        min-height: 44px;
      }
      .bug-detail-row {
        font-size: 14px;
        padding: 14px 16px;
      }
      .bug-detail-row pre { font-size: 13px; }
      .bug-pagination { font-size: 14px; }
      .bug-pagination button {
        font-size: 14px;
        padding: 8px 14px;
        min-height: 44px;
      }
      .bug-diag-title { font-size: 12px; }
      .bug-diag-row { font-size: 14px; }
      .bug-diag-extra { font-size: 13px; }

      /* -- Settings -- */
      .settings-desc { font-size: 13px; }
      .settings-hint { font-size: 13px; }

      /* -- CC Flyout: full-screen below navbar on mobile -- */
      #content-row { flex-direction: column; position: relative; }
      #cc-flyout {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        min-width: 100%;
        max-height: none;
        z-index: 998;
        border-left: none;
        border-top: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0s;
      }
      #cc-flyout.collapsed {
        transform: translateY(100%);
        visibility: hidden;
        pointer-events: none;
        width: 100%;
        min-width: 100%;
        overflow: visible;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.25s;
      }
      /* Flyout header: compact app-style bar, pushed below status banner */
      #cc-flyout-header {
        height: 44px;
        padding: 0 10px;
        padding-top: 56px;
        box-sizing: content-box;
        font-size: 12px;
        gap: 6px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      #cc-flyout-header button {
        min-width: 36px;
        min-height: 36px;
        font-size: 12px;
      }
      #cc-new-agent {
        padding: 0 10px !important;
        font-size: 9px !important;
        height: 36px !important;
        letter-spacing: 1px !important;
      }
      #cc-flyout-close,
      #cc-flyout-settings {
        width: 36px !important;
        height: 36px !important;
        font-size: 16px !important;
      }
      /* Flyout resize handle: hidden on mobile */
      #cc-flyout-resize { display: none; }
      /* Hide git-diff context chip on mobile */
      .context-chip[data-id="git-diff"] { display: none; }
      /* Bottom details: reorder so context chips sit above prompt */
      #cc-bottom-details { flex-shrink: 0; }
      #cc-bottom-details-inner {
        display: flex;
        flex-direction: column;
      }
      .prompt-editor-wrap {
        display: flex;
        flex-direction: column;
      }
      .prompt-editor-wrap .context-chips { order: -1; }
      /* Agent tabs: horizontally scrollable strip */
      #cc-agent-tabs {
        flex-shrink: 0;
        padding: 0 8px;
        gap: 2px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
      }
      #cc-agent-tabs::-webkit-scrollbar { height: 0; }
      .cc-agent-tab {
        font-size: 12px;
        padding: 8px 12px;
        min-height: 40px;
        scroll-snap-align: start;
      }
      .cc-session-close {
        min-width: 28px;
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Output area: fills remaining space, native scroll */
      #cc-flyout-output {
        flex: 1;
        min-height: 100px;
        padding: 10px 14px;
        font-size: 13px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Actions bar: compact horizontal strip */
      #cc-flyout-actions {
        padding: 6px 12px;
        gap: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
      }
      /* Bottom details: shrinkable so input stays on-screen */
      #cc-bottom-details {
        flex-shrink: 1;
        min-height: 0;
      }
      #cc-bottom-details-inner {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      #cc-bottom-details-toggle {
        min-width: 36px;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Respond area: chat-app-style pinned at bottom */
      #cc-flyout-respond {
        padding: 8px 12px;
        gap: 8px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
      }
      #cc-respond-input {
        font-size: 16px;
        padding: 10px 14px;
        min-height: 44px;
      }
      #cc-respond-send {
        font-size: 11px;
        padding: 10px 18px;
        min-height: 44px;
      }
      /* Prompt editor: fixed at bottom like a native chat input */
      #cc-prompt-editor-mount {
        font-size: 16px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      #cc-prompt-editor-mount [contenteditable] {
        font-size: 16px !important;
        min-height: 44px;
      }
      /* Settings popup: below the flyout header */
      #cc-flyout-settings-popup {
        position: fixed;
        top: 100px;
        right: 12px;
        bottom: auto;
        left: auto;
        min-width: 200px;
        z-index: 1100;
      }
      .cc-settings-item {
        font-size: 14px;
        padding: 12px 16px;
        min-height: 44px;
      }
      #cc-flyout-history {
        font-size: 13px;
        padding: 12px 16px;
        max-height: 160px;
      }
      .cc-history-item {
        font-size: 13px;
        padding: 8px 0;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      /* Context gauge: slim on mobile */
      #cc-ctx-gauge-wrap {
        flex-shrink: 0;
      }

      /* -- CC Cards (legacy) -- */
      .cc-card { font-size: 13px; }
      .cc-card-header {
        padding: 10px 14px;
        gap: 10px;
        min-height: 44px;
      }
      .cc-card-title { font-size: 11px; }
      .cc-card-preview {
        font-size: 13px;
        padding: 8px 14px 12px;
      }
      .cc-card-body { font-size: 13px; }
      .cc-card.expanded .cc-card-body { padding: 12px 14px; }
      .cc-card-chevron { font-size: 14px; }

      /* -- Conversation Thread (mobile) -- */
      .conv-turn--user { padding: 10px 12px; }
      .conv-user-body { font-size: 14px; }
      .conv-assistant-body { font-size: 14px; }
      .conv-tool { margin-left: 10px; }
      .conv-tool-header { min-height: 36px; padding: 6px 10px; }
      .conv-agent { margin-left: 10px; }
      .conv-depth-1 { margin-left: 16px; }
      .conv-depth-2 { margin-left: 28px; }
      .conv-depth-3 { margin-left: 36px; }

      /* -- CC Template Dropdown -- */
      .cc-template-dropdown { min-width: 220px; }
      .cc-template-item {
        font-size: 12px;
        padding: 8px 10px 8px 22px;
        min-height: 36px;
      }

      /* -- Inputs: prevent iOS zoom -- */
      input[type="text"],
      input[type="number"],
      textarea,
      select {
        font-size: 16px !important;
        min-height: 44px;
      }

      /* -- Test Center -- */
      .tc-switch-text { font-size: 12px; }
      .tc-section-title { font-size: 12px; }
      .tc-runs-table { font-size: 14px; }
      .tc-runs-table th { font-size: 11px; padding: 10px 12px; }
      .tc-runs-table td { font-size: 14px; padding: 12px; }
      .tc-run-btn { font-size: 13px; padding: 10px 20px; min-height: 44px; }
      .tc-cancel-btn { font-size: 13px; padding: 8px 16px; min-height: 44px; }
      .tc-back-btn { font-size: 14px; padding: 8px 16px; min-height: 44px; }
      .tc-action-btn { font-size: 13px; padding: 10px 16px; min-height: 44px; }
      .tc-output-panel { font-size: 13px; }
      .tc-elapsed { font-size: 14px; }
      .tc-live-title { font-size: 16px; }
      .tc-live-stats { font-size: 15px; gap: 16px; }
      .tc-summary-card { font-size: 15px; }
      .tc-bug-error { font-size: 14px; }
      .tc-bug-meta { font-size: 12px; }
      .tc-fail-name { font-size: 14px; }
      .tc-fail-file { font-size: 12px; }
      .tc-fail-error { font-size: 12px; }
      .tc-catalog-group summary { font-size: 13px; padding: 14px 16px; min-height: 48px; }
      .tc-catalog-group-count { font-size: 11px; }
      .tc-catalog-item { font-size: 14px; padding: 10px 16px 10px 28px; min-height: 44px; }
      .tc-catalog-name { font-size: 14px; }
      .tc-catalog-desc { font-size: 13px; }
      .tc-catalog-file { font-size: 12px; }
      .tc-catalog-config { font-size: 11px; }
      .tc-queue-panel-title { font-size: 12px; }
      .tc-queue-item { font-size: 14px; padding: 10px 12px; min-height: 44px; }
      .tc-queue-item-config { font-size: 11px; }
      .tc-queue-remove { font-size: 18px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
      .tc-queue-empty { font-size: 13px; }
      .tc-queue-label { font-size: 9px; min-width: 52px; }
      .tc-queue-banner-label { font-size: 12px; }
      .tc-queue-item-elapsed { font-size: 12px; }
      .tc-history-pagination { font-size: 13px; }
      .tc-history-pagination button { font-size: 12px; padding: 8px 14px; min-height: 44px; }
      .tc-history-filter { font-size: 12px; padding: 8px 12px; min-height: 44px; }
      .tc-dispatch-investigating { font-size: 14px; }

      /* -- Viewer -- */
      .viewer-toolbar {
        font-size: 14px;
        padding: 12px 16px;
        gap: 12px;
      }
      .viewer-title { font-size: 12px; }
      .viewer-vehicle-tab { font-size: 13px; padding: 8px 14px; min-height: 44px; }
      .viewer-toolbar label { font-size: 12px; }
      .viewer-toolbar select { font-size: 16px; padding: 6px 10px; min-height: 44px; }
      .viewer-toolbar input[type="color"] { width: 44px; height: 44px; }
      .viewer-stats { font-size: 12px; }
      .viewer-canvas-wrap { height: calc(100vh - 240px); min-height: 300px; }

      /* -- Auth Gate -- */
      #auth-gate button {
        font-size: 13px;
        padding: 16px 32px;
        min-height: 48px;
      }
      #auth-gate p { font-size: 16px; }

      /* -- Toolbars: wrap on mobile -- */
      .trail-lab-toolbar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .trail-lab-toolbar select {
        min-width: 0;
        width: 100%;
        min-height: 44px;
      }
      .prompt-editor-toolbar {
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px 8px;
      }
      .prompt-editor-body {
        padding: 4px 12px 8px;
      }
      .prompt-editor-attachments:empty {
        display: none;
        padding: 0;
      }

      /* -- Inline flex rows in sections: allow wrapping -- */
      .section [style*="display:flex"],
      .section [style*="display: flex"] {
        flex-wrap: wrap !important;
      }

      /* -- Global Search: mobile adjustments -- */
      #global-search-overlay {
        padding-top: 8vh;
      }
      #global-search-input {
        min-height: 44px;
      }
      #global-search-results {
        max-height: 50vh;
      }
      .global-search-result {
        min-height: 44px;
        display: flex;
        align-items: center;
      }

      /* -- Section grids: single-column on mobile -- */
      .section [style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
      }
    }

    /* ── Extra-small: stat cards go single column ──── */
    @media (max-width: 480px) {
      .stat-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Global Search ─────────────────────────────────── */
    #global-search-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(2,3,5,0.7);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 15vh;
    }
    .global-search-modal {
      background: var(--bg-panel); border: 1px solid var(--border-strong);
      border-radius: 4px; width: 480px; max-width: 90vw;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    #global-search-input {
      width: 100%; padding: 12px 16px;
      background: var(--bg-surface); border: none; border-bottom: 1px solid var(--border);
      color: var(--text); font-size: 14px; font-family: var(--font-body);
      outline: none;
    }
    #global-search-input::placeholder { color: var(--text-quiet); }
    #global-search-results { max-height: 300px; overflow-y: auto; }

    /* ── Markdown Renderer ─────────────────────────────────────────────── */
    .cc-code-block { background: rgba(10, 21, 25, 0.92); border: 1px solid rgba(45, 100, 105, 0.14); border-radius: 4px; margin: 8px 0; overflow: hidden; }
    .cc-code-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px; background: rgba(45, 100, 105, 0.08); border-bottom: 1px solid rgba(45, 100, 105, 0.1); font-size: 10px; color: rgba(128, 164, 174, 0.6); }
    .cc-code-lang { font-family: 'Orbitron', monospace; letter-spacing: 1px; text-transform: uppercase; }
    .cc-code-copy { background: none; border: 1px solid rgba(45, 100, 105, 0.2); color: rgba(128, 164, 174, 0.5); padding: 2px 8px; border-radius: 2px; cursor: pointer; font-size: 9px; transition: all 0.15s; }
    .cc-code-copy:hover { color: rgb(110, 224, 240); border-color: rgba(110, 224, 240, 0.3); }
    .cc-code-body { display: flex; overflow-x: auto; padding: 8px 0; }
    .cc-code-gutter { padding: 0 8px; text-align: right; color: rgba(128, 164, 174, 0.3); user-select: none; border-right: 1px solid rgba(45, 100, 105, 0.1); white-space: pre; font-size: 11px; line-height: 1.5; }
    .cc-code-content { padding: 0 12px; white-space: pre; font-size: 11px; line-height: 1.5; }
    .cc-code-content code { font-family: 'Courier New', monospace; }
    .cc-code-line-num { display: block; }
    .cc-code-line { display: block; }
    .cc-md-code-inline { background: rgba(10, 21, 25, 0.8); border: 1px solid rgba(45, 100, 105, 0.18); padding: 1px 5px; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 0.9em; }
    .cc-md-link { color: rgb(110, 224, 240); text-decoration: none; transition: text-shadow 0.15s; }
    .cc-md-link:hover { text-shadow: 0 0 8px rgba(110, 224, 240, 0.3); }
    .cc-md-table { border-collapse: collapse; margin: 8px 0; width: 100%; }
    .cc-md-table th, .cc-md-table td { border: 1px solid rgba(45, 100, 105, 0.14); padding: 4px 8px; text-align: left; }
    .cc-md-table tr:nth-child(even) { background: rgba(110, 224, 240, 0.02); }

    /* ── Spinner ───────────────────────────────────────────────────────── */
    .cc-spinner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      margin-left: -2px;
    }
    .cc-spinner-char {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: rgb(110, 224, 240);
      width: 18px;
      text-align: center;
      text-shadow: 0 0 8px rgba(110, 224, 240, 0.5);
      animation: cc-spin-glow 2s ease-in-out infinite;
    }
    @keyframes cc-spin-glow {
      0%, 100% { text-shadow: 0 0 6px rgba(110, 224, 240, 0.4); }
      50% { text-shadow: 0 0 14px rgba(110, 224, 240, 0.8); }
    }
    .cc-spinner-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .cc-spinner-tokens {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      color: rgba(128, 164, 174, 0.5);
      margin-left: auto;
    }

    /* ── Heartbeat dots (legacy — kept for swarm view) ───────────────── */
    .hb-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; flex-shrink: 0; vertical-align: middle; }
    .hb-active { background: var(--green); animation: hb-pulse 1s ease-in-out infinite; }
    .hb-steady { background: var(--green); }
    .hb-dim { background: var(--yellow); opacity: 0.7; }
    .hb-stalled { background: var(--red-bright, #d45234); animation: hb-pulse 0.5s ease-in-out infinite; }
    .hb-off { background: var(--border); }
    @keyframes hb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ── Agent throbber (replaces dot + timer in tabs) ─────────────── */
    .cc-throbber {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-right: 2px;
    }
    .cc-throbber-ring {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .cc-throbber-time {
      font-size: 9px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: rgba(128, 164, 174, 0.45);
      line-height: 1;
      letter-spacing: -0.2px;
    }
    .cc-agent-tab.active .cc-throbber-time,
    .cc-agent-tab:hover .cc-throbber-time {
      color: rgba(128, 164, 174, 0.7);
    }

    /* Running — spinning ring */
    .cc-throbber--running .cc-throbber-ring {
      border: 1.5px solid rgba(110, 224, 240, 0.15);
      border-top-color: rgba(110, 224, 240, 0.85);
      animation: throbber-spin 0.8s linear infinite;
    }
    .cc-throbber--running .cc-throbber-time {
      color: rgba(110, 224, 240, 0.5);
    }
    .cc-agent-tab.active .cc-throbber--running .cc-throbber-time {
      color: rgba(110, 224, 240, 0.75);
    }

    /* Running + stalled — pulsing orange ring, no spin */
    .cc-throbber--stalled .cc-throbber-ring {
      border: 1.5px solid rgba(245, 166, 35, 0.15);
      border-top-color: rgba(245, 166, 35, 0.85);
      animation: throbber-stall-pulse 1.2s ease-in-out infinite;
    }
    .cc-throbber--stalled .cc-throbber-time {
      color: rgba(245, 166, 35, 0.5);
    }

    /* Running + dim — slow spin, yellow tint */
    .cc-throbber--dim .cc-throbber-ring {
      border: 1.5px solid rgba(234, 179, 8, 0.12);
      border-top-color: rgba(234, 179, 8, 0.6);
      animation: throbber-spin 1.6s linear infinite;
    }
    .cc-throbber--dim .cc-throbber-time {
      color: rgba(234, 179, 8, 0.45);
    }

    /* Done — green dot + dimmer duration */
    .cc-throbber--done .cc-throbber-ring {
      width: 6px;
      height: 6px;
      background: var(--green);
    }
    .cc-throbber--done .cc-throbber-time {
      color: rgba(128, 164, 174, 0.35);
    }

    /* Error — red dot */
    .cc-throbber--error .cc-throbber-ring {
      width: 6px;
      height: 6px;
      background: var(--red-bright, #d45234);
    }

    /* Idle / cancelled — dim dot */
    .cc-throbber--idle .cc-throbber-ring {
      width: 6px;
      height: 6px;
      background: var(--border);
    }

    /* Ollama variant — purple ring */
    .cc-throbber--ollama.cc-throbber--running .cc-throbber-ring {
      border-color: rgba(168, 85, 247, 0.15);
      border-top-color: rgba(168, 85, 247, 0.85);
    }
    .cc-throbber--ollama.cc-throbber--running .cc-throbber-time {
      color: rgba(168, 85, 247, 0.5);
    }
    .cc-throbber--ollama .cc-throbber-ring {
      box-shadow: 0 0 4px rgba(168, 85, 247, 0.3);
    }

    @keyframes throbber-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes throbber-stall-pulse {
      0%, 100% { opacity: 1; border-top-color: rgba(212, 82, 52, 0.85); }
      50% { opacity: 0.4; border-top-color: rgba(212, 82, 52, 0.5); }
    }

    /* ── Error classification ──────────────────────────────────────────── */
    .ec-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.05); margin-bottom: 4px; }
    .ec-icon { font-size: 12px; }
    .ec-suggestion { font-size: 11px; color: var(--accent); margin-top: 4px; padding: 4px 8px; background: rgba(110, 224, 240, 0.05); border-radius: 3px; border-left: 2px solid var(--accent); }

    /* ── Shimmer ───────────────────────────────────────────────────────── */
    .cc-shimmer {
      display: inline-block;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      color: transparent !important;
    }
    .cc-shimmer--stalled { filter: saturate(0.5); }

    /* ── Tool badges ───────────────────────────────────────────────────── */
    .conv-tool-badge { display: inline-block; padding: 1px 6px; border-radius: 2px; font-family: 'Orbitron', monospace; font-size: 9px; letter-spacing: 1px; margin-right: 6px; }
    .tool-type-read { background: rgba(110, 224, 240, 0.15); color: rgb(110, 224, 240); }
    .tool-type-edit { background: rgba(60, 255, 60, 0.12); color: rgb(60, 255, 60); }
    .tool-type-bash { background: rgba(252, 116, 30, 0.12); color: rgb(252, 116, 30); }
    .tool-type-agent { background: rgba(170, 100, 255, 0.12); color: rgb(170, 100, 255); }
    .tool-type-search { background: rgba(255, 180, 42, 0.12); color: rgb(255, 180, 42); }
    .tool-type-default { background: rgba(128, 164, 174, 0.1); color: rgba(128, 164, 174, 0.7); }

    /* ── Tool status ───────────────────────────────────────────────────── */
    .tool-running .conv-tool-status { color: rgb(110, 224, 240); animation: pulse 1.5s ease-in-out infinite; }
    .tool-done .conv-tool-status { color: rgb(60, 255, 60); }
    .tool-error .conv-tool-status { color: rgb(212, 82, 52); }

    /* ── Collapsible groups ────────────────────────────────────────────── */
    .cc-group { margin: 4px 0; border: 1px solid rgba(45, 100, 105, 0.1); border-radius: 3px; }
    .cc-group-header { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; color: rgba(201, 248, 255, 0.7); transition: background 0.15s; }
    .cc-group-header:hover { background: rgba(110, 224, 240, 0.05); }
    .cc-group-chevron { font-size: 10px; width: 12px; transition: transform 0.15s; }
    .cc-group-badge { background: rgba(110, 224, 240, 0.2); color: rgb(110, 224, 240); padding: 0 5px; border-radius: 8px; font-size: 10px; font-weight: 600; }
    .cc-group-body { max-height: 0; overflow: hidden; transition: max-height 250ms cubic-bezier(0.4, 0, 0.2, 1); padding: 0 8px; }
    .cc-group-item { padding: 3px 8px; font-size: 11px; color: rgba(128, 164, 174, 0.7); border-left: 2px solid rgba(45, 100, 105, 0.12); margin: 2px 0; }
    .cc-group-item--animate { opacity: 0; animation: fadeSlideUp 200ms ease forwards; }
    .cc-group-depth-badge { font-size: 9px; color: rgba(252, 116, 30, 0.6); margin-left: 4px; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .conv-turn-new { animation: fadeSlideUp 200ms ease forwards; }

    /* ── Tab timer (legacy — now integrated into .cc-throbber) ────────── */
    .cc-tab-timer { font-size: 10px; color: rgba(128, 164, 174, 0.4); margin-left: 4px; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
    .cc-agent-tab.active .cc-tab-timer, .cc-agent-tab:hover .cc-tab-timer { color: rgba(128, 164, 174, 0.65); }

    /* ── Tab context menu ──────────────────────────────────────────────── */
    .cc-tab-context-menu { position: fixed; background: rgba(7, 15, 19, 0.97); border: 1px solid rgba(45, 100, 105, 0.24); border-radius: 3px; padding: 4px 0; backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(2, 3, 5, 0.5); z-index: 200; min-width: 120px; }
    .cc-tab-context-item { padding: 6px 12px; font-size: 11px; color: rgba(201, 248, 255, 0.7); cursor: pointer; transition: background 0.15s; }
    .cc-tab-context-item:hover { background: rgba(110, 224, 240, 0.08); color: rgba(201, 248, 255, 0.95); }

    /* ── New-tab button in tab bar ───────────────────────────────────── */
    .cc-tab-new {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      min-width: 24px;
      height: 24px;
      margin: 4px 2px 0;
      align-self: stretch;
      padding: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-quiet);
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 3px 3px 0 0;
      cursor: pointer;
      flex-shrink: 0;
      transition: color var(--tr-fast), background var(--tr-fast), border-color var(--tr-fast);
    }
    .cc-tab-new:hover {
      color: var(--accent);
      background: rgba(255,255,255,0.04);
      border-color: var(--border);
    }

    /* ── Scroll-to-bottom button ───────────────────────────────────────── */
    .cc-scroll-bottom { position: absolute; bottom: 60px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: rgba(10, 21, 25, 0.9); border: 1px solid rgba(110, 224, 240, 0.3); color: rgb(110, 224, 240); cursor: pointer; font-size: 14px; z-index: 5; display: flex; align-items: center; justify-content: center; }
    .cc-scroll-bottom:hover { background: rgba(110, 224, 240, 0.1); box-shadow: 0 0 8px rgba(110, 224, 240, 0.2); }

    /* ── Depth indicators ──────────────────────────────────────────────── */
    .cc-depth-1 { border-left: 2px solid rgba(110, 224, 240, 0.3); margin-left: 8px; }
    .cc-depth-2 { border-left: 2px solid rgba(170, 100, 255, 0.3); margin-left: 16px; }
    .cc-depth-3 { border-left: 2px solid rgba(252, 116, 30, 0.3); margin-left: 24px; }

    /* ── Conversation search ───────────────────────────────────────────── */
    .cc-search-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(10, 21, 25, 0.95); border-bottom: 1px solid rgba(45, 100, 105, 0.14); }
    .cc-search-input { flex: 1; background: rgba(7, 15, 19, 0.8); border: 1px solid rgba(45, 100, 105, 0.2); color: rgb(230, 241, 238); padding: 4px 8px; border-radius: 3px; font-size: 12px; outline: none; }
    .cc-search-input:focus { border-color: rgba(110, 224, 240, 0.4); box-shadow: 0 0 8px rgba(110, 224, 240, 0.1); }
    .cc-search-count { font-size: 10px; color: rgba(128, 164, 174, 0.5); min-width: 50px; text-align: center; }
    .cc-search-bar button { background: none; border: 1px solid rgba(45, 100, 105, 0.2); color: rgba(128, 164, 174, 0.5); padding: 2px 6px; border-radius: 2px; cursor: pointer; font-size: 11px; }
    .cc-search-bar button:hover { color: rgb(110, 224, 240); border-color: rgba(110, 224, 240, 0.3); }
    .cc-search-highlight { background: rgba(255, 180, 42, 0.2); }
    .cc-search-highlight--current { background: rgba(255, 180, 42, 0.4); box-shadow: 0 0 4px rgba(255, 180, 42, 0.2); }

    /* ── Floating windows ──────────────────────────────────────────────── */
    .cc-floating-window { position: fixed; background: rgba(7, 15, 19, 0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(45, 100, 105, 0.38); border-radius: 6px; box-shadow: 0 20px 56px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(110, 224, 240, 0.06); display: flex; flex-direction: column; overflow: hidden; transition: box-shadow 0.15s; }
    .cc-floating-window:focus-within { box-shadow: 0 20px 56px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(45, 100, 105, 0.5), inset 0 1px 0 rgba(110, 224, 240, 0.08); }
    .cc-float-titlebar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: rgba(10, 22, 27, 0.88); border-bottom: 1px solid rgba(45, 100, 105, 0.2); cursor: grab; user-select: none; flex-shrink: 0; }
    .cc-float-titlebar:active { cursor: grabbing; }

    .cc-float-resize--s { bottom: -3px; left: 4px; right: 4px; height: 6px; cursor: s-resize; }
    .cc-float-resize--e { right: -3px; top: 4px; bottom: 4px; width: 6px; cursor: e-resize; }
    .cc-float-resize--w { left: -3px; top: 4px; bottom: 4px; width: 6px; cursor: w-resize; }
    .cc-float-resize--ne { top: -3px; right: -3px; width: 8px; height: 8px; cursor: ne-resize; }
    .cc-float-resize--nw { top: -3px; left: -3px; width: 8px; height: 8px; cursor: nw-resize; }
    .cc-float-resize--se { bottom: -3px; right: -3px; width: 8px; height: 8px; cursor: se-resize; }
    .cc-float-resize--sw { bottom: -3px; left: -3px; width: 8px; height: 8px; cursor: sw-resize; }

    /* ── Diff renderer ─────────────────────────────────────────────────── */
    .cc-diff { font-family: 'Courier New', monospace; font-size: 11px; }
    .cc-diff-hunk { margin: 4px 0; border: 1px solid rgba(45, 100, 105, 0.08); border-radius: 2px; }
    .cc-diff-line { display: flex; line-height: 1.5; }

    .cc-diff-line--remove { background: rgba(122, 41, 54, 0.3); }
    .cc-diff-gutter { min-width: 32px; text-align: right; padding: 0 6px; color: rgba(128, 164, 174, 0.3); user-select: none; }
    .cc-diff-prefix { width: 12px; text-align: center; user-select: none; }
    .cc-diff-content { flex: 1; white-space: pre-wrap; word-break: break-all; }

    .cc-diff-hunk-label { color: rgba(128, 164, 174, 0.5); font-size: 10px; font-style: italic; }
    .cc-diff-actions { display: none; gap: 6px; padding: 2px 0; }
    .cc-diff-hunk-header:hover .cc-diff-actions { display: flex; }
    .cc-diff-accept, .cc-diff-reject, .cc-diff-comment { padding: 2px 8px; border-radius: 2px; border: 1px solid rgba(45, 100, 105, 0.2); background: none; cursor: pointer; font-size: 10px; transition: all 0.15s; }
    .cc-diff-accept { color: rgb(60, 255, 60); }
    .cc-diff-accept:hover { background: rgba(60, 255, 60, 0.1); border-color: rgba(60, 255, 60, 0.3); }
    .cc-diff-reject { color: rgb(212, 82, 52); }
    .cc-diff-reject:hover { background: rgba(212, 82, 52, 0.1); border-color: rgba(212, 82, 52, 0.3); }
    .cc-diff-empty { padding: 16px; text-align: center; color: rgba(128, 164, 174, 0.4); }
    .cc-diff-word--add { background: rgba(56, 166, 96, 0.3); border-radius: 2px; padding: 0 1px; }
    .cc-diff-word--remove { background: rgba(179, 89, 107, 0.3); border-radius: 2px; padding: 0 1px; text-decoration: line-through; }
    .cc-diff-comment { color: rgba(128, 164, 174, 0.6); }
    .cc-diff-comment:hover { background: rgba(128, 164, 174, 0.1); border-color: rgba(128, 164, 174, 0.3); }
    .cc-diff-truncated { padding: 8px; text-align: center; color: rgba(255, 180, 42, 0.6); font-style: italic; }
    .cc-diff-show-all { background: none; border: 1px solid rgba(255, 180, 42, 0.3); color: rgba(255, 180, 42, 0.7); padding: 2px 8px; border-radius: 2px; cursor: pointer; margin-left: 8px; }
    .cc-diff-binary { padding: 16px; text-align: center; color: rgba(128, 164, 174, 0.5); font-style: italic; }

            <button id="cc-flyout-settings" style="background:none; border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text-dim); cursor:pointer; font-size:14px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; transition:all 0.15s ease;" title="Session options">&#8942;</button>
