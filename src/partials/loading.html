        <div class="loading-spinner__bar loading-spinner__bar--1"></div>
        <div class="loading-spinner__bar loading-spinner__bar--2"></div>
        <div class="loading-spinner__bar loading-spinner__bar--3"></div>
        <div class="loading-spinner__sq loading-spinner__sq--1"></div>
        <div class="loading-spinner__sq loading-spinner__sq--2"></div>
      </div>
    </div>

  <!-- Loading Screen -->
  <div id="loading-screen" role="status" aria-label="Loading game">
    <div class="loading-panel">
      <img src="/images/logo.webp" alt="LUMINAL.live" class="game-logo">
      <div class="loading-subtitle" style="display:none">.live</div>
      <div class="loading-stage">
        <div class="loading-spinner" id="loading-spinner">
          <div class="loading-spinner__bar loading-spinner__bar--1"></div>
          <div class="loading-spinner__bar loading-spinner__bar--2"></div>
          <div class="loading-spinner__bar loading-spinner__bar--3"></div>
          <div class="loading-spinner__sq loading-spinner__sq--1"></div>
          <div class="loading-spinner__sq loading-spinner__sq--2"></div>
        </div>
        <div class="click-prompt" id="click-prompt"><canvas id="click-prompt-canvas"></canvas></div>
      </div>
      <div class="loading-status" id="loading-status" aria-live="polite">LOADING</div>
    </div>

      <div class="loading-install-pill">
        <svg class="loading-install-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="1.5" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5.5 10.5v1.8M10.5 10.5v1.8M3.5 12.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M8 4.5v3M6.5 6.2L8 8l1.5-1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

      </div>
    </div>
    <div class="bb-credit" style="position:absolute;bottom:12px;font-size:11px;"><span class="early-alpha">EARLY ALPHA</span><span id="version-loading" class="version-glow">v1.0.10</span></div>
  </div>
